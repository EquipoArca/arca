    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="dark-mode.css">

<style>
        body {
            background-color: #fff5f3;
            margin: 0;
            font-family: 'Itim', cursive, sans-serif;
            overflow-y: auto; /* Scroll natural de toda la ventana */
        }

        /* Quitamos el absolute y el flex con overflow que cortaban las tarjetas */
        .main-content {
            margin-top: 95px; /* Deja espacio exacto para que la barra superior no estorbe */
            width: 100%;
            display: block;
            box-sizing: border-box;
            padding: 0 20px 50px 20px;
            overflow-y: auto; /* Scroll natural de toda la ventana */
        }

        .feed-novedades {
            width: 100%;
            max-width: 950px;
            margin: 0 auto; /* Centra las tarjetas perfectamente sin romper el layout */
        }

        .tarjeta-prototipo-estilo {
            background: #fff5f3; 
            border-radius: 20px;
            padding: 20px 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border: 2px solid #f9d5d3;
            width: 100%;
            font-family: 'Itim', cursive, sans-serif;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .proto-card-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 14px; 
        }

        .proto-titulo-pill { 
            background: #fbc2c4; 
            color: #3b2a2a; 
            padding: 6px 20px; 
            border-radius: 20px; 
            font-size: 18px; 
            font-weight: bold; 
        }

        .proto-fecha { 
            font-size: 14px; 
            color: #666; 
        }

        .proto-card-body { 
            display: flex; 
            gap: 20px; 
            align-items: stretch; 
        }

        /* Contenedor de imágenes rediseñado para que no se deforme */
        .proto-img-wrapper { 
            width: 240px; 
            height: 160px; 
            border-radius: 16px; 
            overflow: hidden; 
            background: #ffffff; 
            border: 2px solid #f5c2bf; 
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .proto-content-right { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
        }

        .proto-pill-tipo { 
            background: #ffffff; 
            color: #444; 
            padding: 6px 16px; 
            border-radius: 15px; 
            font-size: 14px; 
            font-weight: bold; 
            border: 1.5px solid #f5c2bf; 
            display: inline-block; 
            align-self: flex-start; 
            margin-bottom: 8px;
        }

        .proto-autor { 
            font-size: 14px; 
            color: #555; 
        }

        .proto-autor a { 
            color: #d9534f; 
            text-decoration: none; 
            font-weight: bold; 
        }

        .proto-footer-row { 
            display: flex; 
            justify-content: flex-end; 
            margin-top: 10px; 
        }
        
        .proto-btn-detalles { 
            background-color: #fffde8; 
            color: #442c20; 
            border: 1.5px solid #f0e6b8; 
            padding: 8px 24px; 
            border-radius: 30px; 
            cursor: pointer; 
            font-size: 14px;
            font-family: 'Itim', cursive, sans-serif;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }
        .proto-btn-detalles:hover { background-color: #fff9c4; transform: translateY(-1px); }
    </style>
</head>
<body>

        </div>

    <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Busca algo">

    <div class="top-right">
        <div class="user-header-info">
            <div class="user-profile-menu" id="user-profile-menu">

                    <img src="logo.png" id="user-avatar-img" alt="Perfil">
                </div>
                <div class="mini-menu-card" id="mini-menu-card">
                    <div class="mini-menu-header">
                        <span id="mini-menu-username">Fundación</span>
                    </div>
                    <hr class="mini-menu-divider">
                    <a href="javascript:void(0)" onclick="mostrarSeccion('configuracion')" class="mini-menu-item btn-ajustes">

                        <span>Ajustes</span>
                    </a>
                    <a href="javascript:void(0)" class="mini-menu-item btn-cerrar-sesion" id="btn-cerrar-sesion-mini">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Cerrar sesión</span>
                    </a>
                </div>
            </div>
            <div class="notif-circle">
                <a href="#"><i class="fa-solid fa-bell"></i></a>
            </div>
        </div>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="side-icons">
        <a href="home.html?seccion=inicio" id="link-inicio" class="menu-fila">
            <i class="fa-solid fa-house active"></i>
            <span class="menu-text">Inicio</span>
        </a>
       
        <!-- Redirigen a home.html o llaman a tu función de bloqueo según tu lógica de invitado -->
        <a href="home.html?seccion=perfil" id="link-perfil" class="menu-fila">
            <i class="fa-solid fa-circle-user"></i>
            <span class="menu-text">Perfil</span>
        </a>
       
        <a href="home.html?seccion=guardado" id="link-guardado" class="menu-fila">
            <i class="fa-solid fa-bookmark"></i>
            <span class="menu-text">Guardado</span>
        </a>
       
        <a href="home.html?seccion=mapa" id="link-mapa" class="menu-fila">
            <i class="fa-solid fa-location-dot"></i>
            <span class="menu-text">Mapa</span>
        </a>
       
        <a href="home.html?seccion=configuracion" id="link-config" class="menu-fila">
            <i class="fa-solid fa-gear"></i>
            <span class="menu-text">Ajustes</span>
        </a>
    </div>
</aside>

  <main class="main-content">
      <section class="feed-novedades" id="contenedor-novedades-fundacion">
          <article class="tarjeta-prototipo-estilo">
              <div class="proto-card-top">
                  <div class="proto-titulo-pill">Cargando reportes recientes...</div>
              </div>
          </article>
      </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="script.js"></script>
<script>
      document.addEventListener('DOMContentLoaded', () => {
          const btnToggleMenu = document.getElementById('btn-toggle-menu');
          const sidebar = document.getElementById('sidebar');

          if (btnToggleMenu && sidebar) {
              btnToggleMenu.addEventListener('click', (e) => {
                  e.stopPropagation();
                  sidebar.classList.toggle('sidebar-abierta'); 
              });
          }

          cargarReportesFundacion();
      });

      // Función robusta para extraer cualquier formato de imagen de la BD
      function extraerUrlsImagenes(imgReporteDato) {
          if (!imgReporteDato) return [];
          
          let parsed = imgReporteDato;
          
          // Si es un string, intentamos parsearlo a JSON
          if (typeof parsed === 'string') {
              try {
                  parsed = JSON.parse(parsed);
              } catch (e) {
                  // Si no es un JSON válido, puede ser una sola URL o string plano
                  if (parsed.trim() !== '' && parsed !== '[]') {
                      return [parsed];
                  }
                  return [];
              }
          }

          // Si tras el parseo (o si ya era) es un array
          if (Array.isArray(parsed)) {
              let resultadoFinal = [];
              parsed.forEach(item => {
                  if (typeof item === 'string' && item.trim() !== '') {
                      // Por si viene doblemente parseado como string JSON interno
                      if (item.startsWith('[') || item.startsWith('{')) {
                          try {
                              let subParse = JSON.parse(item);
                              if (Array.isArray(subParse)) {
                                  resultadoFinal.push(...subParse);
                              } else {
                                  resultadoFinal.push(item);
                              }
                          } catch (err) {
                              resultadoFinal.push(item);
                          }
                      } else {
                          resultadoFinal.push(item);
                      }
                  }
              });
              return resultadoFinal;
          }

          return [];
      }

      async function cargarReportesFundacion() {
          const contenedor = document.getElementById('contenedor-novedades-fundacion');
          try {
              const res = await fetch('/api/publicaciones-globales');
              if (!res.ok) throw new Error("Error al consultar reportes");
              
              const publicaciones = await res.json();
              
              // Filtro estricto: Solo reportes de ciudadanos
              const reportes = publicaciones.filter(p => p.tipo_publicacion === 'reporte');

              if (!reportes || reportes.length === 0) {
                  contenedor.innerHTML = `<p style="text-align: center; color: #555; padding: 40px; font-family: 'Itim', cursive;">No hay reportes de ciudadanos disponibles.</p>`;
                  return;
              }

              contenedor.innerHTML = reportes.map(item => {
                  const idRep = item.id_reporte || item.id_origen || item.id_publicacion;
                  const estadoReporte = item.estado || 'Sin atender';
                  
                  // Extraemos las imágenes usando nuestra función robusta
                  const listaFotos = extraerUrlsImagenes(item.img_reporte);
                  
                  let imagenHTML = `
                      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; color: #c97a77; width: 100%; height: 100%; font-size: 13px;">
                          <i class="fa-solid fa-image" style="font-size: 22px; margin-bottom: 4px;"></i>
                          <span>Sin foto</span>
                      </div>`;

                  if (listaFotos.length > 0) {
                      if (listaFotos.length === 1) {
                          imagenHTML = `<img src="${listaFotos[0]}" alt="Foto reporte" style="width:100%; height:100%; object-fit:cover;">`;
                      } else {
                          // Si hay 2 o 3 fotos reales, las distribuimos limpiamente lado a lado
                          imagenHTML = `
                              <div style="display: flex; gap: 3px; width: 100%; height: 100%;">
                                  ${listaFotos.map(img => `<div style="flex: 1; height: 100%; overflow: hidden;"><img src="${img}" alt="Foto" style="width: 100%; height: 100%; object-fit: cover;"></div>`).join('')}
                              </div>
                          `;
                      }
                  }
                  
                  return `
                      <article class="tarjeta-prototipo-estilo">
                          <div class="proto-card-top">
                              <div class="proto-titulo-pill">
                                  UBICACIÓN: <span style="font-size: 16px; font-weight: normal;">${item.Ubicacion || item.ubicacion || 'Medellín'}</span>
                              </div>
                              <span class="proto-fecha">${item.Fecha_reporte ? item.Fecha_reporte.split('T')[0] : 'Reciente'}</span>
                          </div>
                          
                          <div class="proto-card-body">
                              <div class="proto-img-wrapper">
                                  ${imagenHTML}
                              </div>
                              
                              <div class="proto-content-right">
                                  <div>
                                      <span class="proto-pill-tipo">TIPO: ${item.nombre_tipo_reporte || 'Reporte General'}</span>
                                      <div class="proto-info-extra" style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                                          <span class="proto-autor">REPORTADO POR: <a href="perfil_publico.html?user=${encodeURIComponent(item.nombre_usuario || 'usuario')}">@${item.nombre_usuario || 'usuario'}</a></span>
                                          <span style="background: #ffffff; padding: 4px 14px; border-radius: 50px; border: 1.5px solid #f5c2bf; color: #5c4033; font-size: 13px; font-weight: bold;">
                                              Estado: ${estadoReporte}
                                          </span>
                                      </div>
                                  </div>
                                  
                                  <div class="proto-footer-row">
                                      <a href="detalle_reporte.html?id=${idRep}&origen=fundacion" class="proto-btn-detalles">
                                          Ver detalles
                                      </a>
                                  </div>
                              </div>
                          </div>
                      </article>
                  `;
              }).join('');
          } catch (error) {
              console.error(error);
              contenedor.innerHTML = `<p style="text-align: center; color: #555; padding: 40px; font-family: 'Itim', cursive;">No se pudieron cargar los reportes en este momento.</p>`;
          }
      }
  </script>
</body>
