<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="dark-mode.css">
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem("modo_oscuro") === "true") {
            document.body.classList.add("dark-mode");
        }
    });

    <style>
        /* ANIMACIONES PERSONALIZADAS ARCA */
        @keyframes arcaEntradaPop {
            0% { opacity: 0; transform: scale(0.88) translateY(20px) rotate(-1deg); }
            60% { opacity: 1; transform: scale(1.02) translateY(-4px) rotate(0.5deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
        }

        @keyframes flotarSoft {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(1.5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .btn-flotante-mas {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 62px;
            height: 62px;
            background: linear-gradient(135deg, #e8a87c 0%, #d9966c 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 10px 25px rgba(217, 150, 108, 0.4);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
        }
        .btn-flotante-mas:hover {
            transform: scale(1.15) rotate(90deg);
            box-shadow: 0 14px 30px rgba(217, 150, 108, 0.5);
        }

        .modal-overlay-arca {
            position: fixed;
            inset: 0;
            background: rgba(92, 64, 51, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-contenido-arca {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 42px;
            padding: 40px 32px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 24px 50px rgba(92, 64, 51, 0.2);
            text-align: center;
            position: relative;
            animation: arcaEntradaPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .btn-opcion-modal-tipo {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin: 12px 0;
            border-radius: 9999px;
            font-family: 'Itim', cursive, sans-serif;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-decoration: none;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.9);
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(92, 64, 51, 0.06);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-sizing: border-box;
        }
        .btn-opcion-modal-tipo:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(232, 168, 124, 0.35);
        }

        .modal-foto-overlay {
            position: fixed;
            inset: 0;
            background: rgba(92, 64, 51, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* MODAL DETALLES CON ESTILES ORGÁNICOS Y CRISTALIZADOS */
        .modal-foto-contenido {
            background: rgba(255, 248, 235, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 42px;
            padding: 38px;
            position: relative;
            box-shadow: 0 28px 60px rgba(92, 64, 51, 0.22);
            animation: arcaEntradaPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .btn-cerrar-modal {
            position: absolute;
            top: 16px;
            right: 22px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #775a4c;
            font-family: 'Itim', cursive, sans-serif;
            transition: transform 0.25s ease, color 0.25s ease;
        }
        .btn-cerrar-modal:hover {
            transform: scale(1.25) rotate(90deg);
            color: #e57373;
        }

        /* ICONO DE CASITA Y LOGO FLOTANTE */
        .arca-casita-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
            vertical-align: middle;
            margin-left: 8px;
            animation: flotarSoft 3.5s ease-in-out infinite;
        }
    </style>
</head>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const btnToggleMenu = document.getElementById('btn-toggle-menu');
        const sidebar = document.getElementById('sidebar');

        if (btnToggleMenu && sidebar) {
            btnToggleMenu.addEventListener('click', () => {
                sidebar.classList.toggle('sidebar-abierta');
            });
        }
    }); 

    function abrirModalNuevaPub() {
        document.getElementById('modal-nueva-publicacion').style.display = 'flex';
    }

    function cerrarModalNuevaPub() {
        document.getElementById('modal-nueva-publicacion').style.display = 'none';
    }

    function cerrarModalFuera(event) {
        if (event.target.id === 'modal-nueva-publicacion') {
            cerrarModalNuevaPub();
        }
    }

    /* SISTEMA DE ALERTAS PERSONALIZADAS CON ANIMACIÓN Y SIN EMOJIS */
    function mostrarAlertaArca(titulo, mensaje, opciones = {}) {
        const {
            tipo = "error",
            textoBoton = "Entendido",
            alCerrar = null
        } = opciones;

        document.getElementById("alerta-arca-personalizada")?.remove();

        if (!document.getElementById("estilos-alerta-arca")) {
            const estilos = document.createElement("style");
            estilos.id = "estilos-alerta-arca";
            estilos.textContent = `
                .arca-alerta-overlay {
                    position: fixed;
                    inset: 0;
                    z-index: 999999;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    padding: 20px;
                    background: rgba(92, 64, 51, 0.45);
                    backdrop-filter: blur(10px);
                    -webkit-backdrop-filter: blur(10px);
                    animation: arcaAparecer .25s ease;
                }

                .arca-alerta-tarjeta {
                    width: min(100%, 380px);
                    padding: 35px 28px 28px;
                    border: 2px solid rgba(255, 255, 255, 0.95);
                    border-radius: 38px;
                    background: rgba(255, 241, 242, 0.92);
                    backdrop-filter: blur(18px);
                    -webkit-backdrop-filter: blur(18px);
                    box-shadow: 0 24px 50px rgba(92, 64, 51, 0.22);
                    text-align: center;
                    font-family: 'Itim', cursive, sans-serif;
                    animation: arcaEntradaPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
                }

                .arca-alerta-icono-wrapper {
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    width: 76px;
                    height: 76px;
                    margin: 0 auto 18px;
                    border: 4px solid #ffffff;
                    border-radius: 50%;
                    background: rgba(250, 212, 222, 0.9);
                    box-shadow: 0 8px 20px rgba(233, 133, 160, 0.35);
                    animation: flotarSoft 3.5s ease-in-out infinite;
                }

                .arca-alerta-icono-wrapper img {
                    width: 42px;
                    height: 42px;
                    object-fit: contain;
                }

                .arca-alerta-titulo {
                    margin: 0 0 10px;
                    color: #704653;
                    font-size: 25px;
                    font-weight: 400;
                    letter-spacing: 0.5px;
                }

                .arca-alerta-mensaje {
                    margin: 0 0 24px;
                    color: #795F68;
                    font-size: 16.5px;
                    font-weight: 400;
                    line-height: 1.5;
                    overflow-wrap: anywhere;
                    letter-spacing: 0.3px;
                }

                .arca-alerta-botones {
                    display: flex;
                    gap: 12px;
                }

                .arca-alerta-boton {
                    flex: 1;
                    padding: 13px 20px;
                    border: 2px solid rgba(255, 255, 255, 0.9);
                    border-radius: 9999px;
                    background: #E985A0;
                    color: white;
                    font-family: 'Itim', cursive, sans-serif;
                    font-size: 17px;
                    font-weight: 400;
                    letter-spacing: 0.5px;
                    cursor: pointer;
                    box-shadow: 0 6px 15px rgba(233, 133, 160, 0.3);
                    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
                }

                .arca-alerta-boton:hover {
                    background: #D96F8D;
                    transform: translateY(-3px) scale(1.02);
                    box-shadow: 0 10px 25px rgba(233, 133, 160, 0.4);
                }

                .arca-alerta-boton-secundario {
                    background: rgba(255, 255, 255, 0.8);
                    color: #704653;
                    border: 2px solid rgba(233, 133, 160, 0.4);
                    box-shadow: 0 4px 12px rgba(92, 64, 51, 0.05);
                }

                .arca-alerta-boton-secundario:hover {
                    background: #ffffff;
                    color: #5c3542;
                }

                @keyframes arcaAparecer {
                    from { opacity: 0; }
                    to { opacity: 1; }
                }
            `;
            document.head.appendChild(estilos);
        }

        const overlay = document.createElement("div");
        overlay.id = "alerta-arca-personalizada";
        overlay.className = "arca-alerta-overlay";
        overlay.setAttribute("role", "alertdialog");
        overlay.setAttribute("aria-modal", "true");

        const tarjeta = document.createElement("div");
        tarjeta.className = "arca-alerta-tarjeta";

        const iconoWrap = document.createElement("div");
        iconoWrap.className = "arca-alerta-icono-wrapper";
        
        const imgIcono = document.createElement("img");
        imgIcono.src = "logo.png";
        imgIcono.alt = "Icono ARCA";
        iconoWrap.appendChild(imgIcono);

        const encabezado = document.createElement("h2");
        encabezado.className = "arca-alerta-titulo";
        encabezado.textContent = titulo;

        const texto = document.createElement("p");
        texto.className = "arca-alerta-mensaje";
        texto.textContent = mensaje;

        const contenedorBotones = document.createElement("div");
        contenedorBotones.className = "arca-alerta-botones";

        const boton = document.createElement("button");
        boton.type = "button";
        boton.className = "arca-alerta-boton";
        boton.textContent = textoBoton;

        boton.addEventListener("click", () => {
            overlay.remove();
            if (typeof alCerrar === "function") {
                alCerrar(true);
            }
        });

        contenedorBotones.appendChild(boton);

        if (opciones.conCancelar) {
            const botonCancelar = document.createElement("button");
            botonCancelar.type = "button";
            botonCancelar.className = "arca-alerta-boton arca-alerta-boton-secundario";
            botonCancelar.textContent = opciones.textoCancelar || "Cancelar";
            botonCancelar.addEventListener("click", () => {
                overlay.remove();
                if (typeof alCerrar === "function") {
                    alCerrar(false);
                }
            });
            contenedorBotones.prepend(botonCancelar);
        }

        tarjeta.append(iconoWrap, encabezado, texto, contenedorBotones);
        overlay.appendChild(tarjeta);
        document.body.appendChild(overlay);

        boton.focus();
    }

    let misReportesCache = [];

    firebase.auth().onAuthStateChanged(async (user) => {
        if (user) {
            await cargarMisPublicaciones(user.email);
        }
    });

    async function cargarMisPublicaciones(correo) {
        const grid = document.getElementById('grid-mis-publicaciones');
        const estadoVacio = document.getElementById('estado-vacio-mis-pubs');

        try {
            const [respReportes, respIdsGuardados] = await Promise.all([
                fetch(`/api/mis-reportes?correo=${encodeURIComponent(correo)}`),
                fetch(`/api/guardados/ids/${encodeURIComponent(correo)}`)
            ]);
            
            if (!respReportes.ok) throw new Error("No se pudieron cargar las publicaciones");

            let reportes = await respReportes.json();
            misReportesCache = reportes;
            let idsGuardados = respIdsGuardados.ok ? await respIdsGuardados.json() : [];

            if (reportes && reportes.length > 0) {
                if (estadoVacio) estadoVacio.style.display = 'none';

                reportes.sort((a, b) => new Date(b.Fecha_reporte || 0) - new Date(a.Fecha_reporte || 0));

                for (const reporte of reportes) {
                    const card = document.createElement('div');
                    card.style.cssText = `
                        background: rgba(232, 168, 124, 0.22);
                        border: 2px solid rgba(255, 255, 255, 0.85);
                        border-radius: 32px;
                        padding: 22px;
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                        box-shadow: 0 10px 25px rgba(92, 64, 51, 0.05);
                        position: relative;
                        backdrop-filter: blur(8px);
                        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
                    `;

                    card.onmouseenter = () => { card.style.transform = 'translateY(-4px)'; };
                    card.onmouseleave = () => { card.style.transform = 'translateY(0)'; };

                    let fechaFormateada = "Fecha no disponible";
                    if (reporte.Fecha_reporte) {
                        const dateObj = new Date(reporte.Fecha_reporte);
                        if (!isNaN(dateObj)) {
                            fechaFormateada = dateObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
                        }
                    }
                    
                    const esAdopcion = reporte.tipo_publicacion === 'adopcion';
                    const textoBadge = esAdopcion ? 'En Adopción' : 'Mi Reporte';
                    const colorFondoBadge = esAdopcion ? 'rgba(252, 228, 236, 0.9)' : 'rgba(250, 237, 205, 0.9)';
                    const colorTextoBadge = esAdopcion ? '#ad526a' : '#8c6d3f';

                    let imagenSrc = reporte.img_reporte || '';
                    if (esAdopcion && imagenSrc.startsWith('[')) {
                        try {
                            const arrFotos = JSON.parse(imagenSrc);
                            if (Array.isArray(arrFotos) && arrFotos.length > 0) {
                                imagenSrc = arrFotos[0];
                            }
                        } catch(e) {}
                    }

                    const tipoReporte = reporte.nombre_tipo_reporte || reporte.NOMBRE_TIPO_REPORTE || reporte.tipo_emergencia || (esAdopcion ? 'Adopción de Mascota' : 'Reporte General');
                    
                    const idUnico = reporte.id_publicacion || reporte.id_origen;
                    const estaGuardado = Array.isArray(idsGuardados) && idsGuardados.includes(idUnico);
                    
                    const colorIcono = estaGuardado ? '#d97736' : '#e8a87c';
                    const fondoBoton = estaGuardado ? 'rgba(250, 237, 205, 0.9)' : 'transparent';

                    let textoUbicacionBruta = reporte.Ubicacion || reporte.ubicacion || '';
                    let ubicacionBonita = typeof obtenerNombreUbicacionGlobal === 'function' 
                        ? await obtenerNombreUbicacionGlobal(textoUbicacionBruta) 
                        : textoUbicacionBruta;

                    card.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-family: 'Itim', cursive, sans-serif; font-size: 13.5px; color: #555; font-weight: 400;">
                                <i class="fa-regular fa-calendar" style="color: #e8a87c;"></i> ${fechaFormateada}
                            </span>
                            <span style="font-family: 'Itim', cursive, sans-serif; font-size: 12.5px; background: ${colorFondoBadge}; color: ${colorTextoBadge}; padding: 4px 14px; border-radius: 9999px; font-weight: 400; border: 1px solid rgba(255,255,255,0.8);">
                                ${textoBadge}
                            </span>
                        </div>

                        ${imagenSrc ? `
                            <div style="width: 100%; height: 160px; border-radius: 22px; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.9);">
                                <img src="${imagenSrc}" alt="Imagen de la publicación" style="width: 100%; height: 100%; object-fit: cover;">
                            </div>
                        ` : ''}

                        <h3 style="font-family: 'Itim', cursive, sans-serif; color: #2c2c2c; font-size: 20px; margin: 0; font-weight: 400; letter-spacing: 0.4px;">
                            ${tipoReporte}
                        </h3>

                        <p style="font-family: 'Itim', cursive, sans-serif; color: #555; font-size: 15px; margin: 0; line-height: 1.4; font-weight: 400;">
                            ${reporte.Descripcion ? (reporte.Descripcion.substring(0, 70) + '...') : 'Sin descripción.'}
                        </p>

                        <div style="display: flex; align-items: center; gap: 6px; font-family: 'Itim', cursive, sans-serif; color: #666; font-size: 14px; margin-top: 2px; font-weight: 400;">
                            <i class="fa-solid fa-location-dot" style="color: #e8a87c;"></i>
                            <span>${ubicacionBonita}</span>
                        </div>

                        <div style="display: flex; gap: 10px; margin-top: 8px; align-items: center;">
                            <button onclick="verDetallesPublicacionUnificada(${idUnico})" style="flex: 1; background: #e8a87c; border: 2px solid rgba(255, 255, 255, 0.9); color: white; font-family: 'Itim', cursive, sans-serif; padding: 10px 14px; border-radius: 9999px; cursor: pointer; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); font-weight: 400; font-size: 15px;">
                                <i class="fa-solid fa-eye"></i> Ver detalles
                            </button>
                            <button id="btn-guardar-${idUnico}" data-guardado="${estaGuardado}" onclick="toggleGuardarPublicacion(${idUnico})" style="background: ${fondoBoton}; border: 2px solid #e8a87c; padding: 10px 14px; border-radius: 9999px; cursor: pointer; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);" title="${estaGuardado ? 'Quitar de guardados' : 'Guardar publicación'}">
                                <i class="fa-solid fa-bookmark" style="color: ${colorIcono}; font-size: 16px;"></i>
                            </button>
                        </div>
                    `;

                    grid.appendChild(card);
                }
            }
        } catch (error) {
            console.error("Error al conectar:", error);
        }
    }

    function verDetallesPublicacionUnificada(idPubOGeneral) {
        const user = firebase.auth().currentUser;
        if (!user) {
            mostrarAlertaArca("Aviso", "Debes iniciar sesión para ver los detalles.", { tipo: "aviso" });
            return;
        }

        const item = misReportesCache.find(r => 
            r.id_publicacion === idPubOGeneral || r.id_reporte === idPubOGeneral || r.id_origen === idPubOGeneral
        );

        if (!item) {
            mostrarAlertaArca("Error", "No se encontró la información de esta publicación.", { tipo: "error" });
            return;
        }

        const esAdopcion = item.tipo_publicacion === 'adopcion';
        const contenedor = document.getElementById('contenido-detalle-dinamico');
        
        let fechaFormateada = "Reciente";
        if (item.Fecha_reporte) {
            const dateObj = new Date(item.Fecha_reporte);
            if (!isNaN(dateObj)) {
                fechaFormateada = dateObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
            }
        }

        const tipoReporte = item.nombre_tipo_reporte || item.NOMBRE_TIPO_REPORTE || item.tipo_emergencia || (esAdopcion ? 'Adopción de Mascota' : 'Publicación');
        const idReal = item.id_origen || item.id_publicacion;

        let fotoDetalle = item.img_reporte || '';
        if (esAdopcion && fotoDetalle.startsWith('[')) {
            try {
                const arr = JSON.parse(fotoDetalle);
                if (Array.isArray(arr) && arr.length > 0) {
                    fotoDetalle = arr[0];
                }
            } catch(e) {}
        }

        /* DISEÑO DE LA VENTANA DETALLES CON LOGO FLOTANTE Y CAJAS SUAVES REDONDEADAS */
        contenedor.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed rgba(232, 168, 124, 0.5); padding-bottom: 14px; margin-bottom: 22px;">
                <h2 style="font-family: 'Itim', cursive, sans-serif; color: #d97736; margin: 0; font-size: 26px; font-weight: 400; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px;">
                    <span>${tipoReporte}</span>
                    <img src="logo.png" alt="Casita ARCA" class="arca-casita-icon">
                </h2>
                <span style="font-family: 'Itim', cursive, sans-serif; color: #777; font-size: 14px; font-weight: 400;">
                    Publicado el ${fechaFormateada}
                </span>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start;">
                <div>
                    ${fotoDetalle ? `
                        <div style="width: 100%; height: 230px; border-radius: 28px; overflow: hidden; border: 3px solid rgba(255, 255, 255, 0.95); box-shadow: 0 8px 20px rgba(92, 64, 51, 0.08);">
                            <img src="${fotoDetalle}" alt="Imagen" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    ` : '<p style="font-family: \'Itim\', cursive, sans-serif; font-weight: 400;">Sin imagen adjunta</p>'}
                    
                    <div style="margin-top: 16px; background: rgba(250, 237, 205, 0.7); backdrop-filter: blur(6px); border: 1.5px solid rgba(255,255,255,0.9); padding: 14px 18px; border-radius: 24px; font-family: 'Itim', cursive, sans-serif; font-weight: 400; color: #5c4033; font-size: 14.5px;">
                        <strong style="font-weight: 400; color: #d97736;">Ubicación:</strong> ${item.Ubicacion || item.ubicacion || 'No especificada'}
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 14px;">
                    <div style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(6px); border: 2px solid rgba(232, 168, 124, 0.4); padding: 18px 20px; border-radius: 28px; font-family: 'Itim', cursive, sans-serif; font-weight: 400; box-shadow: 0 6px 18px rgba(92, 64, 51, 0.04);">
                        <h4 style="margin: 0 0 8px 0; color: #d97736; font-size: 17px; font-weight: 400;">Descripción:</h4>
                        <p style="margin: 0; color: #444; font-size: 15px; line-height: 1.45; font-weight: 400;">
                            ${item.Descripcion || 'Sin descripción detallada.'}
                        </p>
                    </div>

                    <div style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(6px); border: 2px solid rgba(232, 168, 124, 0.4); padding: 16px 20px; border-radius: 28px; font-family: 'Itim', cursive, sans-serif; font-weight: 400; box-shadow: 0 6px 18px rgba(92, 64, 51, 0.04);">
                        <h4 style="margin: 0 0 8px 0; color: #d97736; font-size: 15px; font-weight: 400;">Contacto:</h4>
                        <p style="margin: 4px 0; font-size: 14.5px; font-weight: 400; color: #444;"><i class="fa-solid fa-phone" style="color: #e8a87c; margin-right: 6px;"></i> ${item.telefono_contacto || 'No registrado'}</p>
                        <p style="margin: 4px 0; font-size: 14.5px; font-weight: 400; color: #444; word-break: break-all;"><i class="fa-solid fa-envelope" style="color: #e8a87c; margin-right: 6px;"></i> ${item.correo_contacto || user.email}</p>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 14px; margin-top: 26px; border-top: 2px dashed rgba(232, 168, 124, 0.5); padding-top: 22px;">
                <button onclick="abrirEditarPub(${idReal}, '${item.tipo_publicacion}')" style="flex: 1; background: rgba(250, 237, 205, 0.9); border: 2px solid rgba(255,255,255,0.9); color: #8c6d3f; font-family: 'Itim', cursive, sans-serif; padding: 13px; border-radius: 9999px; cursor: pointer; font-size: 16px; font-weight: 400; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 4px 12px rgba(92, 64, 51, 0.05);">
                    <i class="fa-solid fa-pen-to-square" style="margin-right: 6px;"></i> Editar
                </button>
                <button onclick="eliminarPub(${idReal}, '${item.tipo_publicacion}')" style="flex: 1; background: #e57373; border: 2px solid rgba(255,255,255,0.9); color: white; font-family: 'Itim', cursive, sans-serif; padding: 13px; border-radius: 9999px; cursor: pointer; font-size: 16px; font-weight: 400; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 6px 15px rgba(229, 115, 115, 0.3);">
                    <i class="fa-solid fa-trash" style="margin-right: 6px;"></i> Eliminar
                </button>
            </div>
        `;

        document.getElementById('modal-detalle-publicacion').style.display = 'flex';
    }

    function cerrarModalDetalle() {
        document.getElementById('modal-detalle-publicacion').style.display = 'none';
    }

    function cerrarModalDetalleOverlay(event) {
        if (event.target.id === 'modal-detalle-publicacion') {
            cerrarModalDetalle();
        }
    }

    async function eliminarPub(id, tipo) {
        mostrarAlertaArca(
            "¿Eliminar publicación?",
            "¿Estás seguro de que deseas eliminar esta publicación? Esta acción no se puede deshacer.",
            {
                tipo: "pregunta",
                textoBoton: "Sí, eliminar",
                conCancelar: true,
                textoCancelar: "Cancelar",
                alCerrar: async (confirmado) => {
                    if (!confirmado) return;

                    const endpoint = tipo === 'adopcion' ? `/api/adopciones/${id}` : `/api/reportes/${id}`;

                    try {
                        const response = await fetch(endpoint, { method: 'DELETE' });
                        const resultado = await response.json();

                        if (response.ok) {
                            mostrarAlertaArca("¡Éxito!", "Publicación eliminada correctamente.", {
                                tipo: "aviso",
                                alCerrar: () => {
                                    cerrarModalDetalle();
                                    window.location.reload();
                                }
                            });
                        } else {
                            throw new Error(resultado.error || "No se pudo eliminar.");
                        }
                    } catch (error) {
                        console.error("Error al eliminar:", error);
                        mostrarAlertaArca("Error", "Hubo un error al intentar eliminar la publicación.", { tipo: "error" });
                    }
                }
            }
        );
    }

    function abrirEditarPub(id, tipo) {
        const mensajeTexto = tipo === 'adopcion' 
            ? "¡Vamos a cargar los datos de tu adopción para que puedas editarlos!" 
            : "¡Vamos a cargar los datos de tu reporte para que puedas editarlos!";

        mostrarAlertaArca("Editar publicación", mensajeTexto, {
            tipo: "aviso",
            textoBoton: "Continuar",
            alCerrar: () => {
                if (tipo === 'adopcion') {
                    window.location.href = `formulario_adopcion.html?editar=${id}`;
                } else {
                    window.location.href = `formularior.html?editar=${id}`;
                }
            }
        });
    }

    async function toggleGuardarPublicacion(idPublicacion) {
        const user = firebase.auth().currentUser;
        if (!user || !user.email) {
            mostrarAlertaArca("Aviso", "Debes iniciar sesión para gestionar tus guardados.", { tipo: "aviso" });
            return;
        }

        const btn = document.getElementById(`btn-guardar-${idPublicacion}`);
        if (!btn) return;

        const icono = btn.querySelector('i');
        const estaGuardadoActual = btn.getAttribute('data-guardado') === 'true';
        const endpoint = estaGuardadoActual ? '/api/quitar-guardado' : '/api/guardar-publicacion';

        try {
            const respuesta = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo: user.email, id_publicacion: idPublicacion })
            });

            const resultadoJson = await respuesta.json();
            if (!respuesta.ok) throw new Error(resultadoJson.error || "Error en el servidor");

            if (estaGuardadoActual) {
                icono.style.color = '#e8a87c';
                btn.style.background = 'transparent';
                btn.setAttribute('data-guardado', 'false');
                mostrarNotificacion("Eliminado de publicaciones guardadas");
            } else {
                icono.style.color = '#d97736';
                btn.style.background = 'rgba(250, 237, 205, 0.9)';
                btn.setAttribute('data-guardado', 'true');
                mostrarNotificacion("¡Publicación guardada con éxito!");
            }
        } catch (error) {
            mostrarAlertaArca("Error", "Hubo un error: " + error.message, { tipo: "error" });
        }
    }

    function mostrarNotificacion(mensaje) {
        const notifExistente = document.getElementById('arca-toast-notificacion');
        if (notifExistente) notifExistente.remove();

        const toast = document.createElement('div');
        toast.id = 'arca-toast-notificacion';
        toast.innerHTML = `<i class="fa-solid fa-bookmark" style="color: #d97736; margin-right: 10px;"></i> ${mensaje}`;
        toast.style.cssText = `
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(250, 237, 205, 0.95); color: #8c6d3f; border: 2px solid rgba(255, 255, 255, 0.9); padding: 13px 26px;
            border-radius: 9999px; font-family: 'Itim', cursive, sans-serif; font-size: 16px; font-weight: 400; box-shadow: 0 10px 30px rgba(92, 64, 51, 0.18);
            z-index: 9999; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease; opacity: 0; display: flex; align-items: center; backdrop-filter: blur(8px);
        `;
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.transform = 'translateX(-50%) translateY(0)'; toast.style.opacity = '1'; }, 10);
        setTimeout(() => { toast.style.transform = 'translateX(-50%) translateY(100px)'; toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
    }
    </script>

                    const googleCombo = document.querySelector('.goog-te-combo');

                        clearInterval(interval);
