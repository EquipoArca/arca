<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte - ARCA</title>
    <link rel="stylesheet" href="style_home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="dark-mode.css">
    <script>
    if (localStorage.getItem("modo_oscuro") === "true") {
        document.body.classList.add("dark-mode");
    }
    </script>
</head>
<body>

  <!-- Barra de Navegación Superior -->
  <nav class="top-nav">
    <div class="top-left">
        <i class="fa-solid fa-bars menu-icon" id="btn-toggle-menu"></i>
        
        <div class="mini-logo-circle">
            <img src="logo.png" alt="Logo">
        </div>
        <span class="page-title" id="titulo-pagina">Reporte</span>
    </div>

    <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="input-busqueda-nav" name="busqueda" placeholder="Busca algo" aria-label="Buscar en la aplicación">
        <i class="fa-solid fa-microphone"></i>
    </div>

    <div class="top-right">
        <div class="user-header-info">

            <!-- 1. PERFIL Y MINI MENÚ (Avatar con menú desplegable) -->
            <div class="user-profile-menu" id="user-profile-menu">
                <div class="user-avatar-btn" id="user-avatar-btn" onclick="toggleMiniMenu()">
                    <img src="logo.png" id="user-avatar-img" alt="Perfil">
                </div>

                <div class="mini-menu-card" id="mini-menu-card">
                    <div class="mini-menu-header">
                        <span id="mini-menu-username">Usuario</span>
                    </div>
                    
                    <hr class="mini-menu-divider">
                    
                    <a href="javascript:void(0)" onclick="mostrarSeccion('configuracion')" class="mini-menu-item btn-ajustes">
                        <i class="fa-solid fa-gear"></i>
                        <span>Ajustes</span>
                    </a>
                    
                    <a href="javascript:void(0)" class="mini-menu-item btn-cerrar-sesion" id="btn-cerrar-sesion-mini">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Cerrar sesión</span>
                    </a>
                </div>
            </div>

            <!-- 2. CAMPANA DE NOTIFICACIONES -->
            <div class="notif-circle">
                <a href="notificaciones.html" aria-label="Notificaciones"><i class="fa-solid fa-bell"></i></a>
            </div>

        </div>
    </div>
  </nav>

    <!-- Barra Lateral (Sidebar) -->
    <aside class="sidebar" id="sidebar">
        <div class="side-icons">
            <a href="home.html" class="menu-fila">
                <i class="fa-solid fa-house"></i>
                <span class="menu-text">Inicio</span>
            </a>
            <a href="perfil_usuario.html" class="menu-fila">
                <i class="fa-solid fa-circle-user"></i>
                <span class="menu-text">Perfil</span>
            </a>
            <a href="guardados_usuario.html" class="menu-fila">
                <i class="fa-solid fa-bookmark"></i>
                <span class="menu-text">Guardado</span>
            </a>
            <a href="mapa.html" class="menu-fila">
                <i class="fa-solid fa-location-dot"></i>
                <span class="menu-text">Mapa</span>
            </a>
            <a href="configuracion.html" class="menu-fila">
                <i class="fa-solid fa-gear"></i>
                <span class="menu-text">Ajustes</span>
            </a>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content">
        <form id="formReporteArca" class="grid-reporte">
            
            <!-- Columna Izquierda: Tipo de Reporte y Descripción -->
            <div class="columna-reporte-izq">
                <div class="titulo-capsula">¿Qué desea reportar?</div>
                
                <div class="grupo-checkboxes">
                    <label class="opcion-check">
                        <input type="radio" id="reporte-opcion-1" name="tipo_reporte" value="1" required>
                        <span class="custom-checkbox"></span>
                        <span class="texto-input-falso">Animal en situación de calle</span>
                    </label>
                    <label class="opcion-check">
                        <input type="radio" id="reporte-opcion-2" name="tipo_reporte" value="2">
                        <span class="custom-checkbox"></span>
                        <span class="texto-input-falso">Animal en peligro</span>
                    </label>
                    <label class="opcion-check">
                        <input type="radio" id="reporte-opcion-3" name="tipo_reporte" value="3">
                        <span class="custom-checkbox"></span>
                        <span class="texto-input-falso">Animal herido</span>
                    </label>
                    <label class="opcion-check">
                        <input type="radio" id="reporte-opcion-4" name="tipo_reporte" value="4">
                        <span class="custom-checkbox"></span>
                        <span class="texto-input-falso">Maltrato animal</span>
                    </label>
                    <label class="opcion-check">
                        <input type="radio" id="reporte-opcion-5" name="tipo_reporte" value="5">
                        <span class="custom-checkbox"></span>
                        <span class="texto-input-falso">Otro</span>
                    </label>
                </div>

                <div class="descripcion-container">
                    <label for="descripcion-reporte" class="subtitulo-reporte">Descripción de la situación y el animal (lo más detalladamente posible).</label>
                    <textarea id="descripcion-reporte" name="descripcion_reporte" placeholder="Descripción..." required></textarea>
                </div>
            </div>

            <!-- Columna Derecha: Ubicación, Fotos y Contacto -->
            <div class="columna-reporte-der">
                <div class="titulo-capsula">Ubicación</div>
                
                <div class="fila-ubicacion">
                    <button type="button" class="btn-ubicacion-actual" id="btn-ubicacion">Usar tu ubicación actual</button>
                    <span class="separador-o">o</span>
                    <input type="text" id="input-direccion" name="direccion_reporte" class="input-direccion" placeholder="Ingresa una dirección" required>
                </div>

                <div class="foto-opcional">
                    <div class="titulo-foto-capsula">Agregar fotos (recomendado)</div>
                    
                    <!-- Contenedor para previsualizar imagen actual (del código 2) -->
                    <div class="contenedor-foto-actual" style="margin-bottom: 15px;">
                        <label style="font-size: 14px; color: #666; display: block;">Imagen actual del reporte:</label>
                        <img id="preview-img-reporte" src="" alt="Foto del reporte" style="max-width: 200px; display: none; border-radius: 8px; margin-top: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);" />
                    </div>

                    <div class="zona-drop" id="zona-arrastre">
                        <input type="file" id="input-archivo-oculto" name="fotos_reporte" accept="image/*" style="display: none;" multiple>
                        <div class="circulo-upload" id="btn-circulo">
                            <i class="fa-solid fa-plus"></i>
                        </div>
                        <button type="button" class="btn-subir-archivo" id="btn-subir-archivo">Sube un archivo</button>
                        <span class="texto-arrastra" id="texo-arrastra">o arrastra una imagen aquí</span>
                    </div>
                </div>

                <div class="contacto-seccion">
                    <div class="titulo-capsula">Deja un medio de contacto</div>
                    <div class="input-contacto-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <label for="contacto-telefono" class="sr-only" style="display:none;">Teléfono de contacto</label>
                        <input type="tel" id="contacto-telefono" name="telefono_contacto" placeholder="Teléfono">
                    </div>
                    <div class="input-contacto-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <label for="contacto-correo" class="sr-only" style="display:none;">Correo de contacto</label>
                        <input type="email" id="contacto-correo" name="correo_contacto" placeholder="Correo">
                    </div>
                </div>

                <button type="submit" class="btn-enviar-reporte">Enviar Reporte</button>
            </div>

        </form>
    </main>

    <!-- Firebase v8 Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <!-- Tus scripts principales -->
    <script src="script.js"></script>
    <script src="reportes.js"></script>
    
    <!-- Script unificado para la barra lateral -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnToggleMenu = document.getElementById('btn-toggle-menu');
            const sidebar = document.getElementById('sidebar');

            if (btnToggleMenu && sidebar) {
                btnToggleMenu.addEventListener('click', (e) => {
                    e.stopPropagation(); // Evita conflictos con clics globales
                    sidebar.classList.toggle('sidebar-abierta');
                });
            }
        });
    </script>
    <!-- Motor oculto de Google Translate -->
<div id="google_translate_element" style="display:none;"></div>
<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({ pageLanguage: 'es', autoDisplay: false }, 'google_translate_element');
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- Script para aplicar el idioma guardado al cambiar de página -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('app_selected_lang');
        if (savedLang && savedLang !== 'es') {
            const interval = setInterval(() => {
                const googleCombo = document.querySelector('.goog-te-combo');
                if (googleCombo) {
                    googleCombo.value = savedLang;
                    googleCombo.dispatchEvent(new Event('change'));
                    clearInterval(interval);
                }
            }, 200);
        }
    });
</script>
<style>
    .goog-te-banner-frame { display: none !important; }
    body { top: 0 !important; }
    .skiptranslate { display: none !important; }
</style>
</body>
</html>
