<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donación - ARCA</title>

    <link rel="stylesheet" href="style_home.css">
    <link rel="stylesheet" href="style_donacion.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="dark-mode.css">

    <script>
        (function () {
            const temaGuardado = localStorage.getItem('darkMode');

            const esOscuro = temaGuardado !== null
                ? temaGuardado === 'true'
                : localStorage.getItem('modo_oscuro') === 'true';

            document.documentElement.classList.toggle(
                'dark-mode',
                esOscuro
            );

            document.addEventListener('DOMContentLoaded', function () {
                document.body.classList.toggle(
                    'dark-mode',
                    esOscuro
                );
            });
        })();
    </script>
</head>

<body>
    <!-- Barra Superior -->
    <nav class="top-nav">
        <div class="top-left">
            <i class="fa-solid fa-bars menu-icon" id="btn-toggle-menu" onclick="toggleSidebar()"></i>
            <div class="mini-logo-circle">
                <img src="logo.png" alt="Logo">
            </div>
            <span class="page-title" id="titulo-pagina">Donación</span>
        </div>

        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Busca algo">
            <i class="fa-solid fa-microphone"></i>
        </div>

        <div class="top-right">
            <div class="user-header-info">
                <div class="user-profile-menu" id="user-profile-menu">
                    <div class="user-avatar-btn" id="user-avatar-btn" onclick="toggleMiniMenu()">
                        <img src="logo.png" id="user-avatar-img" alt="Perfil">
                    </div>
                    <div class="mini-menu-card" id="mini-menu-card">
                        <div class="mini-menu-header">
                            <span id="mini-menu-username">Usuario</span>
                        </div>
                        <hr class="mini-menu-divider">
                        <a href="home.html?seccion=configuracion" class="mini-menu-item btn-ajustes">
                            <i class="fa-solid fa-gear"></i>
                            <span>Ajustes</span>
                        </a>
                        <a href="javascript:void(0)" class="mini-menu-item btn-cerrar-sesion" id="btn-cerrar-sesion-mini">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span>Cerrar sesión</span>
                        </a>
                    </div>
                </div>
                <div class="notif-circle">
                    <a href="notificaciones.html" aria-label="Notificaciones"><i class="fa-solid fa-bell"></i></a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Barra Lateral -->
    <aside class="sidebar" id="sidebar">
        <div class="side-icons">
            <a href="home.html?seccion=inicio" id="link-inicio" class="menu-fila">
                <i class="fa-solid fa-house active"></i>
                <span class="menu-text">Inicio</span>
            </a>
            <a href="home.html?seccion=perfil" id="link-perfil" class="menu-fila">
                <i class="fa-solid fa-circle-user"></i>
                <span class="menu-text">Perfil</span>
            </a>
            <a href="home.html?seccion=guardado" id="link-guardado" class="menu-fila">
                <i class="fa-solid fa-bookmark"></i>
                <span class="menu-text">Guardado</span>
            </a>
            <a href="home.html?seccion=mapa" id="link-mapa" class="menu-fila">
                <i class="fa-solid fa-location-dot"></i>
                <span class="menu-text">Mapa</span>
            </a>
            <a href="home.html?seccion=configuracion" id="link-config" class="menu-fila">
                <i class="fa-solid fa-gear"></i>
                <span class="menu-text">Ajustes</span>
            </a>
        </div>
    </aside>

    <!-- Contenido Principal de Donación -->
    <main class="main-content" style="opacity: 1; visibility: visible;">
        <div class="donation-main-container">
            <div class="donation-grid">
                
                <!-- Columna Izquierda: Tipo de donación y Descripción -->
                <div class="donation-column">
                    <div class="section-pill-title">Tipo de donación</div>
                    
                    <div class="donation-options-group">
                        <label class="donation-option-row">
                            <input type="checkbox">
                            <div class="donation-custom-checkbox"></div>
                            <div class="donation-input-pill">Dinero</div>
                        </label>
                        <label class="donation-option-row">
                            <input type="checkbox">
                            <div class="donation-custom-checkbox"></div>
                            <div class="donation-input-pill">Juguetes</div>
                        </label>
                        <label class="donation-option-row">
                            <input type="checkbox">
                            <div class="donation-custom-checkbox"></div>
                            <div class="donation-input-pill">Comida</div>
                        </label>
                        <label class="donation-option-row">
                            <input type="checkbox">
                            <div class="donation-custom-checkbox"></div>
                            <div class="donation-input-pill">Ropa</div>
                        </label>
                        <label class="donation-option-row">
                            <input type="checkbox">
                            <div class="donation-custom-checkbox"></div>
                            <div class="donation-input-pill">Otro</div>
                        </label>
                    </div>

                    <div style="margin-top: 10px;">
                        <span class="donation-label-text">Cantidad o descripción del donativo</span>
                        <textarea class="donation-textarea" placeholder="Descripción..."></textarea>
                    </div>
                </div>

                <!-- Columna Derecha: Fundación, Entrega y Contacto -->
                <div class="donation-column">
                    <div class="section-pill-title">¿A qué fundación desea donar?</div>
                    
                    <div class="foundation-sub-options">
                        <button type="button" class="btn-select-map">Seleccione una fundación en el mapa</button>
                        <span class="or-separator">o</span>
                        <input type="text" class="donation-input-pill" placeholder="Ingresa el nombre de la fundación" style="flex: 1; min-width: 180px;">
                    </div>

                    <div class="section-pill-title" style="margin-top: 10px;">Forma de entrega</div>
                    
                    <div class="donation-options-group">
                        <label class="donation-option-row">
                            <input type="checkbox">
                            <div class="donation-custom-checkbox"></div>
                            <span class="donation-plain-text">Llevar personalmente al refugio</span>
                        </label>
                        <label class="donation-option-row">
                            <input type="checkbox">
                            <div class="donation-custom-checkbox"></div>
                            <span class="donation-plain-text">Solicitar recogida a domicilio</span>
                        </label>
                    </div>

                    <div class="section-pill-title" style="margin-top: 10px;">Información del donante</div>

                    <div class="donation-options-group" style="gap: 15px;">
                        <div class="donation-contact-wrapper">
                            <i class="fa-solid fa-circle-user"></i>
                            <input type="text" placeholder="Nombre">
                        </div>
                        <div class="donation-contact-wrapper">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" placeholder="Teléfono">
                        </div>
                        <div class="donation-contact-wrapper">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" placeholder="Correo">
                        </div>
                    </div>

                    <button type="button" class="btn-submit-donation">Enviar Donación</button>
                </div>

            </div>
        </div>
    </main>

    <!-- Script Global de la Aplicación -->
    <script src="script.js"></script>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('sidebar-abierta');
        }

        function toggleMiniMenu() {
            const menu = document.getElementById('mini-menu-card');
            if (menu) menu.classList.toggle('show');
        }
    </script>
</body>
</html>
