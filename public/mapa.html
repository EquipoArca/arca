<script>
      const vectoresArca = {
          casita: `<svg style="width:28px;height:28px;vertical-align:middle;" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 32L32 12L54 32V50C54 52.2 52.2 54 50 54H14C11.8 54 10 52.2 10 50V32Z" fill="#FCE4EC" stroke="#E8A87C" stroke-width="4" stroke-linejoin="round"/><path d="M26 54V36C26 33.8 27.8 32 30 32H34C36.2 32 38 33.8 38 36V54" stroke="#D97736" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="24" r="4" fill="#E8A87C"/></svg>`,
          corazon: `<svg width="42" height="42" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M32 54C32 54 10 38 10 23C10 15 16 9 23 9C27.5 9 31 11.5 32 13.5C33 11.5 36.5 9 41 9C48 9 54 15 54 23C54 38 32 54 32 54Z" fill="#FAD4DE" stroke="#E985A0" stroke-width="4" stroke-linejoin="round"/></svg>`,
          huellita: `<svg width="42" height="42" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="18" cy="22" rx="6" ry="8" fill="#E8A87C"/><ellipse cx="46" cy="22" rx="6" ry="8" fill="#E8A87C"/><ellipse cx="29" cy="15" rx="5.5" ry="7.5" fill="#E8A87C"/><ellipse cx="35" cy="15" rx="5.5" ry="7.5" fill="#E8A87C"/><path d="M18 42C18 32 25 28 32 28C39 28 46 32 46 42C46 50 39 52 32 52C25 52 18 50 18 42Z" fill="#E8A87C"/></svg>`,
          nube: `<svg width="42" height="42" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 46H48C53.5 46 58 41.5 58 36C58 30.8 54 26.5 49 26.1C47.8 17.5 40.5 11 31.5 11C23 11 16 16.8 14.3 24.8C9.6 25.8 6 30 6 35C6 41.1 10.5 46 16 46Z" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="4" stroke-linejoin="round"/></svg>`
      };

      function obtenerImagenSegura(imgDato) {
          if (!imgDato) return '';
          try {
              const parsed = JSON.parse(imgDato);
              if (Array.isArray(parsed) && parsed.length > 0) {
                  return parsed[0];
              }
              return imgDato;
          } catch (e) {
              return imgDato;
          }
      }

      function mostrarAlertaArca(titulo, mensaje, opciones = {}) {
          const { tipo = "error", textoBoton = "Entendido", alCerrar = null } = opciones;
          document.getElementById("alerta-arca-personalizada")?.remove();

          if (!document.getElementById("estilos-alerta-arca")) {
              const estilos = document.createElement("style");
              estilos.id = "estilos-alerta-arca";
              estilos.textContent = `
                  .arca-alerta-overlay {
                      position: fixed; inset: 0; z-index: 999999; display: flex; justify-content: center; align-items: center; padding: 20px;
                      background: rgba(92, 64, 51, 0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: arcaAparecer .25s ease;
                  }
                  .arca-alerta-tarjeta {
                      width: min(100%, 380px); padding: 35px 28px 28px; border: 2px solid rgba(255, 255, 255, 0.95); border-radius: 40px;
                      background: rgba(255, 241, 242, 0.94); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
                      box-shadow: 0 24px 50px rgba(92, 64, 51, 0.22); text-align: center; font-family: 'Itim', cursive, sans-serif;
                      animation: arcaEntradaPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
                  }
                  .arca-alerta-icono-wrapper {
                      display: flex; justify-content: center; align-items: center; width: 76px; height: 76px; margin: 0 auto 18px;
                      border: 4px solid #ffffff; border-radius: 50%; background: rgba(250, 212, 222, 0.9);
                      box-shadow: 0 8px 20px rgba(233, 133, 160, 0.35); animation: flotarSoft 3.5s ease-in-out infinite;
                  }
                  .arca-alerta-titulo { margin: 0 0 10px; color: #5c4033; font-size: 25px; font-weight: 400; letter-spacing: 0.5px; }
                  .arca-alerta-mensaje { margin: 0 0 24px; color: #775a4c; font-size: 16.5px; font-weight: 400; line-height: 1.5; overflow-wrap: anywhere; }
                  .arca-alerta-botones { display: flex; gap: 12px; }
                  .arca-alerta-boton {
                      flex: 1; padding: 13px 20px; border: 2px solid rgba(255, 255, 255, 0.9); border-radius: 9999px;
                      background: #E985A0; color: white; font-family: 'Itim', cursive, sans-serif; font-size: 17px; font-weight: 400;
                      cursor: pointer; box-shadow: 0 6px 15px rgba(233, 133, 160, 0.3); transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
                  }
                  .arca-alerta-boton:hover { background: #D96F8D; transform: translateY(-3px) scale(1.03); }
                  @keyframes arcaAparecer { from { opacity: 0; } to { opacity: 1; } }
              `;
              document.head.appendChild(estilos);
          }

          const overlay = document.createElement("div");
          overlay.id = "alerta-arca-personalizada";
          overlay.className = "arca-alerta-overlay";

          const tarjeta = document.createElement("div");
          tarjeta.className = "arca-alerta-tarjeta";

          const iconoWrap = document.createElement("div");
          iconoWrap.className = "arca-alerta-icono-wrapper";
          iconoWrap.innerHTML = tipo === 'pregunta' ? vectoresArca.huellita : vectoresArca.corazon;

          const encabezado = document.createElement("h2");
          encabezado.className = "arca-alerta-titulo";
          encabezado.textContent = titulo;

          const texto = document.createElement("p");
          texto.className = "arca-alerta-mensaje";
          texto.textContent = mensaje;

          const contenedorBotones = document.createElement("div");
          contenedorBotones.className = "arca-alerta-botones";

          const boton = document.createElement("button");
          boton.type = "button";
          boton.className = "arca-alerta-boton btn-arca-animado";
          boton.textContent = textoBoton;
          boton.addEventListener("click", () => {
              overlay.remove();
              if (typeof alCerrar === "function") alCerrar(true);
          });

          contenedorBotones.appendChild(boton);
          tarjeta.append(iconoWrap, encabezado, texto, contenedorBotones);
          overlay.appendChild(tarjeta);
          document.body.appendChild(overlay);
          boton.focus();
      }

      document.addEventListener('DOMContentLoaded', async () => {
          const btnToggleMenu = document.getElementById('btn-toggle-menu');
          const sidebar = document.getElementById('sidebar');
          if (btnToggleMenu && sidebar) {
              btnToggleMenu.addEventListener('click', (e) => {
                  e.stopPropagation();
                  sidebar.classList.toggle('sidebar-abierta');
              });
          }

          let latActual = 6.25184;
          let lngActual = -75.56359;
          let zoomInicial = 13;

          const params = new URLSearchParams(window.location.search);
          const latParam = parseFloat(params.get('lat'));
          const lngParam = parseFloat(params.get('lng'));

          if (!isNaN(latParam) && !isNaN(lngParam)) {
              latActual = latParam;
              lngActual = lngParam;
              zoomInicial = 16;
          }

          const map = L.map('mapa-arca').setView([latActual, lngActual], zoomInicial);

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 19,
              attribution: '© OpenStreetMap contributors - ARCA'
          }).addTo(map);

          let markerMiUbicacion = null;

          function irAMiUbicacionReal(conAlertaError = false) {
              if (navigator.geolocation) {
                  navigator.geolocation.getCurrentPosition(
                      (position) => {
                          latActual = position.coords.latitude;
                          lngActual = position.coords.longitude;
                          map.setView([latActual, lngActual], 16);

                          if (markerMiUbicacion) {
                              markerMiUbicacion.setLatLng([latActual, lngActual]);
                          } else {
                              const iconoUsuario = L.divIcon({
                                  className: 'custom-pin-user',
                                  html: `<div style="background-color: #6bbbe7; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 12px rgba(107, 187, 231, 0.8);"></div>`,
                                  iconSize: [20, 20], iconAnchor: [10, 10]
                              });
                              markerMiUbicacion = L.marker([latActual, lngActual], { icon: iconoUsuario }).addTo(map);
                              markerMiUbicacion.bindTooltip("¡Estás aquí!", { permanent: false, direction: 'top' });
                          }
                          cargarVeterinariasDeLaZona();
                      },
                      (error) => {
                          if (conAlertaError) {
                              mostrarAlertaArca("Ubicación no encontrada", "No pudimos acceder a tu ubicación GPS.", { tipo: "conexion" });
                          }
                      },
                      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                  );
              }
          }

          if (isNaN(latParam)) {
              irAMiUbicacionReal(false);
          }

          document.getElementById('btn-centrar').addEventListener('click', () => {
              irAMiUbicacionReal(true);
          });

          let markersLayer = L.layerGroup().addTo(map);
          let todosLosElementos = [];

          const panelCercanas = document.getElementById('panel-cercanas');
          const btnToggleCercanas = document.getElementById('btn-toggle-cercanas');
          const btnCerrarPanel = document.getElementById('btn-cerrar-panel');

          btnToggleCercanas.addEventListener('click', () => {
              panelCercanas.classList.toggle('abierto');
              actualizarListaCercanas();
          });
          btnCerrarPanel.addEventListener('click', () => {
              panelCercanas.classList.remove('abierto');
          });

          function calcularDistancia(lat1, lon1, lat2, lon2) {
              const R = 6371;
              const dLat = (lat2 - lat1) * Math.PI / 180;
              const dLon = (lon2 - lon1) * Math.PI / 180;
              const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                        Math.sin(dLon/2) * Math.sin(dLon/2);
              const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
              return R * c;
          }

          function actualizarListaCercanas() {
              const contenedorLista = document.getElementById('lista-cercanas');
              const centroMapa = map.getCenter();
              if (!centroMapa) return;
              
              const filtroActivo = document.querySelector('.filtro-btn.active')?.getAttribute('data-filtro') || 'todos';

              const elementosFiltrados = todosLosElementos.filter(item => {
                  if (!item || typeof item.lat !== 'number' || typeof item.lng !== 'number') return false;
                  const t = (item.tipo || '').toLowerCase();
                  if (filtroActivo === 'todos') return true;
                  if (filtroActivo === 'reporte') return t.includes('report') || t.includes('emergencia');
                  if (filtroActivo === 'adopcion') return t.includes('adop');
                  if (filtroActivo === 'evento') return t.includes('evento');
                  if (filtroActivo === 'veterinaria') return t.includes('veterinaria') || t.includes('clinica');
                  return true;
              });

              if (elementosFiltrados.length === 0) {
                  contenedorLista.innerHTML = `<p style="font-size: 13px; color: #775a4c; text-align: center; margin-top: 20px; font-weight: 400;">No hay elementos de esta categoría en esta vista.</p>`;
                  return;
              }

              elementosFiltrados.forEach(el => {
                  el.distanciaKm = calcularDistancia(centroMapa.lat, centroMapa.lng, el.lat, el.lng);
              });
              elementosFiltrados.sort((a, b) => a.distanciaKm - b.distanciaKm);

              let htmlItems = '';
              elementosFiltrados.forEach(el => {
                  const distanciaTexto = el.distanciaKm < 1 ? `${Math.round(el.distanciaKm * 1000)} m` : `${el.distanciaKm.toFixed(1)} km`;
                  const queryMaps = `${el.lat},${el.lng}`;
                  const urlMaps = `https://www.google.com/maps/search/?api=1&query=${queryMaps}`;
                  const nombreMostrar = el.nombre || el.nombre_tipo_reporte || 'Punto';
                  const direccionMostrar = el.direccion || (el.Ubicacion && !el.Ubicacion.includes("Ubicacion GPS") ? el.Ubicacion : "Medellín");

                  htmlItems += `
                      <div class="card-vet-cercana">
                          <p class="vet-nombre">${nombreMostrar}</p>
                          <span class="vet-distancia"><i class="fa-solid fa-location-arrow"></i> A ${distanciaTexto} de ti</span>
                          <p class="vet-dir"><i class="fa-solid fa-location-dot" style="color: #62c385;"></i> ${direccionMostrar}</p>
                          <div class="acciones-vet-cercana">
                              <a href="${urlMaps}" target="_blank" class="btn-accion-card btn-mapa-exacto btn-arca-animado">Abrir en Maps</a>
                              <button class="btn-accion-card btn-enfocar-mapa btn-arca-animado" onclick="enfocarElemento(${el.lat}, ${el.lng})">Ver en mapa</button>
                          </div>
                      </div>
                  `;
              });
              contenedorLista.innerHTML = htmlItems;
          }

          window.enfocarElemento = function(lat, lng) {
              map.setView([lat, lng], 17);
          };

          function renderizarMarcadores(filtro = 'todos') {
              markersLayer.clearLayers();

              todosLosElementos.forEach(item => {
                  if (!item || typeof item.lat !== 'number' || typeof item.lng !== 'number') return;
                  const tipo = (item.tipo || '').toLowerCase();

                  if (filtro !== 'todos') {
                      if (filtro === 'reporte' && !tipo.includes('report') && !tipo.includes('emergencia')) return;
                      if (filtro === 'adopcion' && !tipo.includes('adop')) return;
                      if (filtro === 'evento' && !tipo.includes('evento')) return;
                      if (filtro === 'veterinaria' && !tipo.includes('veterinaria') && !tipo.includes('clinica')) return;
                  }

                  let colorPin = '#e8a87c';
                  let iconoClase = 'fa-paw';
                  let nombreTexto = item.nombre || item.nombre_tipo_reporte || 'Punto ARCA';

                  if (tipo.includes('report') || tipo.includes('emergencia')) {
                      colorPin = '#e57373'; 
                      iconoClase = 'fa-triangle-exclamation';
                  } else if (tipo.includes('adop')) {
                      colorPin = '#e985a0'; 
                      iconoClase = 'fa-heart';
                  } else if (tipo.includes('evento')) {
                      colorPin = '#6bbbe7';
                      iconoClase = 'fa-calendar-days';
                  } else if (tipo.includes('veterinaria') || tipo.includes('clinica')) {
                      colorPin = '#62c385'; 
                      iconoClase = 'fa-hospital';
                  }

                  const customIcon = L.divIcon({
                      className: 'custom-pin-arca',
                      html: `
                          <div style="background-color: ${colorPin}; width: 36px; height: 36px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(92,64,51,0.2); border: 2px solid white;">
                              <i class="fa-solid ${iconoClase}" style="transform: rotate(45deg); color: white; font-size: 14px;"></i>
                          </div>
                      `,
                      iconSize: [36, 36], iconAnchor: [18, 36], popupAnchor: [0, -36]
                  });

                  const marker = L.marker([item.lat, item.lng], { icon: customIcon });

                  marker.bindTooltip(nombreTexto, {
                      permanent: true, direction: 'right', className: 'label-nombre-pin', offset: [10, -20]
                  });

                  let popupContenido = '';
                  if (tipo !== 'veterinaria') {
                      const urlMapsReporte = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
                      const idReal = item.id_origen || item.id_publicacion || '';
                      
                      let paginaDetalle = `detalle_reporte.html?id=${idReal}`;
                      if (item.tipo_publicacion === 'adopcion') {
                          paginaDetalle = `detalle_adopcion.html?id=${idReal}`;
                      } else if (item.tipo_publicacion === 'evento') {
                          paginaDetalle = `detalle_evento.html?id=${idReal}`;
                      }

                      // Procesar la imagen de forma segura extrayéndola del array JSON
                      const fotoUrl = obtenerImagenSegura(item.img_reporte);

                      popupContenido = `
                          <div class="popup-card-arca">
                              ${fotoUrl ? `<img src="${fotoUrl}" alt="Foto">` : `<div class="popup-card-sin-foto"><i class="fa-solid fa-calendar-days" style="color: #6bbbe7; font-size: 20px;"></i><span style="font-size: 11px;">Publicación ARCA</span></div>`}
                              <b>${item.nombre_tipo_reporte || 'Publicación'}</b>
                              <p>${item.Ubicacion && !item.Ubicacion.includes("Ubicacion GPS") ? item.Ubicacion : 'Medellín'}</p>
                              <div style="display: flex; gap: 6px; justify-content: center; margin-top: 6px;">
                                  <a href="${paginaDetalle}" class="btn-ver-caso btn-arca-animado" style="padding: 5px 10px; font-size: 11.5px;">Ver caso</a>
                                  <a href="${urlMapsReporte}" target="_blank" class="btn-ver-caso btn-arca-animado" style="background: #62c385; padding: 5px 10px; font-size: 11.5px;">Maps</a>
                              </div>
                          </div>
                      `;
                  } else {
                      const urlMapsVet = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
                      popupContenido = `
                          <div class="popup-card-arca">
                              <div class="popup-card-sin-foto">
                                  <i class="fa-solid fa-hospital-user" style="color: #62c385; font-size: 20px;"></i>
                                  <span style="font-size: 11.5px;">Veterinaria Aliada</span>
                              </div>
                              <b style="color: #d97736;">${item.nombre}</b>
                              <p><i class="fa-solid fa-location-dot" style="color: #62c385;"></i> ${item.direccion || 'Medellín'}</p>
                              <a href="${urlMapsVet}" target="_blank" class="btn-ver-caso btn-arca-animado" style="background: #62c385;">Abrir en Maps</a>
                          </div>
                      `;
                  }

                  marker.bindPopup(popupContenido);
                  markersLayer.addLayer(marker);
              });
          }

          async function cargarVeterinariasDeLaZona() {
              const bounds = map.getBounds();
              if (!bounds) return;
              const southWest = bounds.getSouthWest();
              const northEast = bounds.getNorthEast();

              const overpassQuery = `
                  [out:json][timeout:25];
                  (
                    node["amenity"="veterinary"](${southWest.lat},${southWest.lng},${northEast.lat},${northEast.lng});
                    way["amenity"="veterinary"](${southWest.lat},${southWest.lng},${northEast.lat},${northEast.lng});
                    relation["amenity"="veterinary"](${southWest.lat},${southWest.lng},${northEast.lat},${northEast.lng});
                    node["shop"="pet"](${southWest.lat},${southWest.lng},${northEast.lat},${northEast.lng});
                  );
                  out body;
                  >;
                  out skel qt;
              `;

              try {
                  const res = await fetch('https://overpass-api.de/api/interpreter', {
                      method: 'POST',
                      body: overpassQuery
                  });
                  if (res.ok) {
                      const datosValidos = await res.json();
                      if (datosValidos && datosValidos.elements) {
                          datosValidos.elements.forEach(element => {
                              let lat = element.lat;
                              let lon = element.lon;
                              if (lat && lon && element.tags) {
                                  const nombreTag = element.tags.name || "Centro Veterinario";
                                  const nuevaVetObj = {
                                      nombre: nombreTag,
                                      tipo: 'veterinaria',
                                      lat: lat,
                                      lng: lon,
                                      direccion: "Medellín"
                                  };
                                  const existe = todosLosElementos.some(e => e && Math.abs(e.lat - lat) < 0.00005 && Math.abs(e.lng - lon) < 0.00005);
                                  if (!existe) todosLosElementos.push(nuevaVetObj);
                              }
                          });
                          const filtroActual = document.querySelector('.filtro-btn.active')?.getAttribute('data-filtro') || 'todos';
                          renderizarMarcadores(filtroActual);
                      }
                  }
              } catch (e) {
                  console.warn("Aviso: La API de OpenStreetMap (Overpass) no respondió o está saturada (502). El mapa principal de reportes seguirá funcionando con normalidad.");
              }
          }

          document.getElementById('btn-escanear').addEventListener('click', () => {
              cargarVeterinariasDeLaZona();
              mostrarAlertaArca("Escaneando zona", "Buscando veterinarias y centros cercanos...", { tipo: "aviso" });
          });

          // Cargar publicaciones globales (Reportes, Adopciones y Eventos)
          auth.onAuthStateChanged(async (user) => {
              try {
                  const correoActual = (user && user.email) ? user.email : '';
                  const respuestaReportes = await fetch(`/api/publicaciones-globales?correo=${encodeURIComponent(correoActual)}`);
                  
                  if (respuestaReportes.ok) {
                      const reportes = await respuestaReportes.json();
                      reportes.forEach(reporte => {
                          const textoUbicacion = reporte.Ubicacion || "";
                          const matches = textoUbicacion.match(/(-?\d+\.\d+),\s*(-?\d+\.\d+)/);

                          let lat = matches ? parseFloat(matches[1]) : null;
                          let lng = matches ? parseFloat(matches[2]) : null;

                          if (isNaN(lat) || isNaN(lng) || lat === null || lng === null) {
                              lat = 6.25184 + (Math.random() - 0.5) * 0.05;
                              lng = -75.56359 + (Math.random() - 0.5) * 0.05;
                          }

                          todosLosElementos.push({
                              id_origen: reporte.id_origen,
                              id_publicacion: reporte.id_publicacion,
                              tipo_publicacion: reporte.tipo_publicacion,
                              nombre_tipo_reporte: reporte.nombre_tipo_reporte,
                              tipo: reporte.tipo_publicacion || 'reporte',
                              lat: lat,
                              lng: lng,
                              Ubicacion: reporte.Ubicacion,
                              img_reporte: reporte.img_reporte,
                              nombre: reporte.nombre_tipo_reporte
                          });
                      });
                  }
              } catch (error) {
                  console.error("Error al cargar publicaciones del servidor:", error);
              }

              renderizarMarcadores('todos');
              cargarVeterinariasDeLaZona();
          });

          const botonesFiltro = document.querySelectorAll('.filtro-btn');
          botonesFiltro.forEach(btn => {
              btn.addEventListener('click', () => {
                  botonesFiltro.forEach(b => b.classList.remove('active'));
                  btn.classList.add('active');
                  const categoria = btn.getAttribute('data-filtro');
                  renderizarMarcadores(categoria);
              });
          });
      });
  </script>
