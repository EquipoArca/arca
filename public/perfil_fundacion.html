<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Fundación - ARCA</title>
    <link rel="stylesheet" href="style_home.css">
    <link rel="stylesheet" href="perfil.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="dark-mode.css">
    <script>
        if (localStorage.getItem("modo_oscuro") === "true") {
            document.body.classList.add("dark-mode");
        }
    </script>
    <style>
        body {
            margin: 0;
            font-family: 'Itim', cursive, sans-serif;
            background-color: #fce8e6;
            overflow-x: hidden;
        }

        .main-content {
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
        }

        /* CONTENEDOR PRINCIPAL CON GLASSMORPHISM Y ANIMACIÓN SUAVE */
        .perfil-fundacion-container {
            max-width: 1050px;
            width: 100%;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 26px;
            padding: 20px 30px;
            box-shadow: 0 15px 35px rgba(220, 150, 140, 0.15);
            box-sizing: border-box;
            animation: fadeInScale 0.4s ease-out forwards;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        /* PORTADA Y FOTO FLOTANTE ESTILO FACEBOOK CORREGIDA */
        .pf-portada-contenedor {
            position: relative;
            width: 100%;
            height: 150px;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: #fce4e4;
            margin-bottom: 45px;
            box-shadow: 0 6px 20px rgba(230, 150, 130, 0.1);
        }

        .pf-portada-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }

        .pf-avatar-flotante {
            position: absolute;
            bottom: -35px;
            left: 25px;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 35px solid #ffffff;
            background: #fff;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
        }

        /* TÍTULO CON SOMBRA SUTIL Y ELEGANTE (SIN NEGRITAS PESADAS) */
        .pf-nombre-titulo {
            margin: 0 0 15px 0;
            color: #2b2b2b;
            font-size: 1.7rem;
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(230, 150, 130, 0.25);
            letter-spacing: 0.5px;
        }

        /* GRID COMPACTO PARA OCUPAR EL ESPACIO SIN DESLIZAR EXCESIVAMENTE */
        .pf-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .pf-card-seccion {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 12px rgba(230, 150, 130, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .pf-card-seccion:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(230, 150, 130, 0.1);
        }

        .pf-label-capsula {
            background-color: rgba(252, 174, 158, 0.8);
            color: #2b2b2b;
            font-size: 0.9rem;
            font-weight: 400;
            padding: 3px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 6px;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.4);
        }

        .pf-texto-info {
            color: #444;
            font-size: 0.9rem;
            line-height: 1.4;
            margin: 0;
            font-weight: 400;
        }

        .pf-redes-fila {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #333;
            text-decoration: none;
        }

        .pf-redes-fila i {
            color: #e06d53;
            width: 18px;
            text-align: center;
            font-size: 1rem;
        }

        .btn-editar-perfil-fundacion {
            background-color: #fbc2c4;
            color: #2b2b2b;
            border: none;
            padding: 10px 30px;
            font-family: 'Itim', cursive;
            font-size: 1.15rem;
            border-radius: 20px;
            cursor: pointer;
            display: block;
            margin: 18px auto 0 auto;
            box-shadow: 0 4px 12px rgba(251, 194, 196, 0.4);
            transition: all 0.2s ease;
            text-decoration: none;
            text-align: center;
            width: fit-content;
        }

        .btn-editar-perfil-fundacion:hover {
            transform: scale(1.04);
            background-color: #f9a3a6;
            box-shadow: 0 6px 16px rgba(249, 163, 166, 0.5);
        }
    </style>
</head>
<body>

    <!-- NAV SUPERIOR -->
    <nav class="top-nav">
        <div class="top-left">
            <i class="fa-solid fa-bars menu-icon" id="btn-toggle-menu"></i>
            <div class="mini-logo-circle"><img src="logo.png" alt="Logo ARCA"></div>
            <span class="page-title">Perfil de Fundación</span>
        </div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Busca algo">
            <i class="fa-solid fa-microphone"></i>
        </div>
        <div class="top-right">
            <div class="user-header-info">
                <div class="user-profile-menu" id="user-profile-menu">
                    <div class="user-avatar-btn" id="user-avatar-btn" onclick="toggleMiniMenu()">
                        <img src="logo.png" id="user-avatar-img" alt="Perfil">
                    </div>
                    <div class="mini-menu-card" id="mini-menu-card">
                        <div class="mini-menu-header"><span id="mini-menu-username">Fundación</span></div>
                        <hr class="mini-menu-divider">
                        <a href="configuracion.html" class="mini-menu-item btn-ajustes"><i class="fa-solid fa-gear"></i><span>Ajustes</span></a>
                        <a href="javascript:void(0)" class="mini-menu-item btn-cerrar-sesion" id="btn-cerrar-sesion-mini"><i class="fa-solid fa-right-from-bracket"></i><span>Cerrar sesión</span></a>
                    </div>
                </div>
                <div class="notif-circle"><a href="notificaciones.html"><i class="fa-solid fa-bell"></i></a></div>
            </div>
        </div>
    </nav>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="side-icons">
            <a href="home.html" class="menu-fila"><i class="fa-solid fa-house"></i><span class="menu-text">Inicio</span></a>
            <a href="perfil_fundacion.html" class="menu-fila activa"><i class="fa-solid fa-circle-user"></i><span class="menu-text">Perfil</span></a>
            <a href="guardados_usuario.html" class="menu-fila"><i class="fa-solid fa-bookmark"></i><span class="menu-text">Guardado</span></a>
            <a href="mapa.html" class="menu-fila"><i class="fa-solid fa-location-dot"></i><span class="menu-text">Mapa</span></a>
            <a href="configuracion.html" class="menu-fila"><i class="fa-solid fa-gear"></i><span class="menu-text">Ajustes</span></a>
        </div>
    </aside>

    <main class="main-content">
        <div class="perfil-fundacion-container">
            
            <!-- PORTADA CON FOTO OFICIAL FLOTANTE ESTILO FACEBOOK CORREGIDA -->
            <div class="pf-portada-contenedor">
                <img id="pf-portada" src="logo.png" alt="Portada" class="pf-portada-preview">
                <img id="pf-avatar" src="logo.png" alt="Foto Oficial" class="pf-avatar-flotante">
            </div>

            <h2 id="pf-nombre-fundacion" class="pf-nombre-titulo">Cargando...</h2>

            <div class="pf-grid">
                
                <!-- COLUMNA IZQUIERDA -->
                <div>
                    <div class="pf-card-seccion">
                        <div class="pf-label-capsula">Misión</div>
                        <p id="pf-mision" class="pf-texto-info">Cargando misión...</p>
                    </div>

                    <div class="pf-card-seccion" style="margin-top: 12px;">
                        <div class="pf-label-capsula">Visión</div>
                        <p id="pf-vision" class="pf-texto-info">Cargando visión...</p>
                    </div>
                </div>

                <!-- COLUMNA DERECHA -->
                <div>
                    <div class="pf-card-seccion">
                        <div class="pf-label-capsula">Enfoque principal</div>
                        <p id="pf-enfoque" class="pf-texto-info">Cargando enfoques...</p>
                    </div>

                    <div class="pf-card-seccion" style="margin-top: 12px;">
                        <div class="pf-label-capsula">Programas / Proyectos actuales</div>
                        <p id="pf-programas" class="pf-texto-info">Cargando proyectos...</p>
                    </div>

                    <div class="pf-card-seccion" style="margin-top: 12px;">
                        <div class="pf-label-capsula">Contáctanos y Redes</div>
                        <div id="pf-redes-container" style="margin-top: 6px;">
                            <!-- Se inyectan dinámicamente -->
                        </div>
                    </div>
                </div>

            </div>

            <!-- Botón para ir al modo editar -->
            <a href="editar_perfil_fundacion.html" class="btn-editar-perfil-fundacion btn-arca-animado">
                Editar perfil
            </a>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            firebase.auth().onAuthStateChanged(async (user) => {
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }

                try {
                    const res = await fetch(`/api/obtener-fundacion?correo=${encodeURIComponent(user.email)}`);
                    if (!res.ok) throw new Error("No se pudo cargar la información de la fundación.");
                    
                    const data = await res.json();

                    const nombreMostrado = data.Nombre_Comercial || data.Nombre_Legal || 'Fundación ARCA';
                    document.getElementById('pf-nombre-fundacion').textContent = nombreMostrado;
                    
                    document.getElementById('pf-mision').textContent = data.Descripcion_mision || 'Sin misión registrada.';
                    document.getElementById('pf-vision').textContent = data.Descripcion_vision || 'Sin visión registrada.';
                    document.getElementById('pf-enfoque').textContent = data.enfoque_otro || 'Rescate y adopción';
                    document.getElementById('pf-programas').textContent = data.Programas_Proyectos_Actuales || 'Sin proyectos actuales.';

                    if (data.Foto_Portada && data.Foto_Portada.trim() !== '') {
                        document.getElementById('pf-portada').src = data.Foto_Portada;
                    }
                    if (data.PFP_Fundacion && data.PFP_Fundacion.trim() !== '') {
                        document.getElementById('pf-avatar').src = data.PFP_Fundacion;
                    }

                    // Renderizar redes y contacto
                    const redesContainer = document.getElementById('pf-redes-container');
                    let htmlRedes = `
                        <div class="pf-redes-fila"><i class="fa-solid fa-envelope"></i> ${data.Correo_fundacion || user.email}</div>
                        <div class="pf-redes-fila"><i class="fa-solid fa-phone"></i> ${data.Telefono_fundacion || 'No registrado'}</div>
                    `;
                    if (data.Pagina_web && data.Pagina_web.trim() !== '') {
                        htmlRedes += `<div class="pf-redes-fila"><i class="fa-solid fa-globe"></i> <a href="${data.Pagina_web}" target="_blank" style="color: #e06d53; text-decoration: none;">${data.Pagina_web}</a></div>`;
                    }
                    redesContainer.innerHTML = htmlRedes;

                } catch (error) {
                    console.error("Error al cargar perfil de fundación:", error);
                }
            });
        });
    </script>
</body>
</html>
