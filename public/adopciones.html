<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopción - ARCA</title>
    <link rel="stylesheet" href="style_home.css">
    <link rel="stylesheet" href="style_adopciones.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="dark-mode.css">
    <script>
    if (localStorage.getItem("modo_oscuro") === "true") {
        document.body.classList.add("dark-mode");
    }
    </script>
    <style>
        /* Estilos ajustados al prototipo del catálogo */
        .seccion-catalogo-adopcion {
            max-width: 950px;
            margin: 0 auto;
            padding: 20px 10px;
        }

        .header-catalogo-adopcion {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-catalogo-adopcion h2 {
            font-size: 24px;
            color: #2b2b2b;
            margin: 0;
        }

        .btn-volver-opciones {
            background: #ffffff;
            border: 1px solid #f9d5d3;
            color: #d9534f;
            padding: 8px 18px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Itim', cursive, sans-serif;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .btn-volver-opciones:hover {
            background: #ffe5dd;
        }

        .tarjeta-prototipo-estilo {
            background: #fde8e5; 
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            border: 2px solid #f9d5d3;
            width: 100%;
            font-family: 'Itim', cursive, sans-serif;
            box-sizing: border-box;
        }

        .proto-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .proto-titulo-pill {
            background: #fbc2c4;
            color: #2b2b2b;
            padding: 8px 32px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
        }

        .proto-fecha {
            font-size: 15px;
            font-weight: bold;
            color: #444;
        }

        .proto-card-body {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .proto-img-wrapper {
            width: 210px;
            height: 150px;
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            border: 2px solid #f9d5d3;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .proto-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .proto-content-right {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .proto-pill-tipo {
            background: #fff;
            color: #333;
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            border: 1px solid #f3c1c3;
            display: inline-block;
            align-self: flex-start;
        }

        .proto-info-extra {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .proto-autor {
            font-size: 14px;
            color: #555;
        }

        .proto-autor a {
            color: #d9534f;
            text-decoration: none;
            font-weight: bold;
        }

        .proto-autor a:hover {
            text-decoration: underline;
        }

        .proto-ubicacion {
            font-size: 13px;
            color: #666;
            margin: 0;
        }

        .proto-footer-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 5px;
        }

        .proto-btn-detalles {
            background-color: #fffde8; 
            color: #2b2b2b;
            border: 1px solid #f0e6b8;
            padding: 10px 28px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: all 0.2s;
            font-family: 'Itim', cursive, sans-serif;
        }

        .proto-btn-detalles:hover {
            background-color: #fff9c4;
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR NAV -->
    <nav class="top-nav">
        <div class="top-left">
            <i class="fa-solid fa-bars menu-icon" id="btn-toggle-menu"></i>
            <div class="mini-logo-circle">
                <img src="logo.png" alt="Logo">
            </div>
            <span class="page-title">Adopción</span>
        </div>

        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Busca algo">
            <i class="fa-solid fa-microphone"></i>
        </div>

        <div class="top-right">
           <div class="user-header-info">

            <!-- PERFIL Y MINI MENÚ -->
            <div class="user-profile-menu" id="user-profile-menu">
                <div class="user-avatar-btn" id="user-avatar-btn" onclick="toggleMiniMenu()">
                    <img src="logo.png" id="user-avatar-img" alt="Perfil">
                </div>

                <div class="mini-menu-card" id="mini-menu-card">
                    <div class="mini-menu-header">
                        <span id="mini-menu-username">Usuario</span>
                    </div>
                    
                    <hr class="mini-menu-divider">
                    
                    <a href="javascript:void(0)" onclick="mostrarSeccion('configuracion')" class="mini-menu-item btn-ajustes">
                        <i class="fa-solid fa-gear"></i>
                        <span>Ajustes</span>
                    </a>
                    
                    <a href="javascript:void(0)" class="mini-menu-item btn-cerrar-sesion" id="btn-cerrar-sesion-mini">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Cerrar sesión</span>
                    </a>
                </div>
            </div>

            <!-- CAMPANA DE NOTIFICACIONES -->
            <div class="notif-circle">
                <a href="notificaciones.html" aria-label="Notificaciones"><i class="fa-solid fa-bell"></i></a>
            </div>

        </div>
    </div>
  </nav>

    <!-- MENÚ LATERAL -->
    <aside class="sidebar" id="sidebar">
        <div class="side-icons">
            <a href="home.html" class="menu-fila">
                <i class="fa-solid fa-house"></i>
                <span class="menu-text">Inicio</span>
            </a>
            <a href="perfil_usuario.html" class="menu-fila">
                <i class="fa-solid fa-circle-user"></i>
                <span class="menu-text">Perfil</span>
            </a>
            <a href="guardados_usuario.html" class="menu-fila">
                <i class="fa-solid fa-bookmark"></i>
                <span class="menu-text">Guardado</span>
            </a>
            <a href="mapa.html" class="menu-fila">
                <i class="fa-solid fa-location-dot"></i>
                <span class="menu-text">Mapa</span>
            </a>
            <a href="configuracion.html" class="menu-fila">
                <i class="fa-solid fa-gear"></i>
                <span class="menu-text">Ajustes</span>
            </a>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content main-adopciones">

        <!-- 1. PANTALLA DE OPCIONES DE ADOPCIÓN -->
        <section id="pantalla-opciones-adopcion" class="seccion-adopcion-opciones">
            <h1 class="titulo-adopciones">Adopciones</h1>
            
            <div class="circulo-logo-adopcion">
                <img src="hlogo.png" alt="Logo Adopciones">
            </div>

            <div class="contenedor-botones-adopcion">
                <button class="btn-adopcion-opcion" onclick="mostrarCatalogoAdopciones()">
                    Ver animales en adopción
                </button>
                <button class="btn-adopcion-opcion" onclick="alHacerClicPonerEnAdopcion()">
                    Poner animal en adopción
                </button>
            </div>
        </section>

        <!-- 2. VISTA DEL CATÁLOGO DE ANIMALES -->
        <section id="seccion-catalogo-animales" class="seccion-catalogo-adopcion" style="display: none;">
            <div class="header-catalogo-adopcion">
                <h2>Animales Cerca de Ti</h2>
                <button onclick="volverAOpciones()" class="btn-volver-opciones">← Volver a opciones</button>
            </div>
            
            <div id="contenedor-animales-adopcion">
                <!-- Se cargan dinámicamente con JS -->
            </div>
        </section>

    </main>

    <!-- MODAL DE AVISO: CREAR PERFIL DE ADOPTANTE -->
    <div id="modal-aviso-adoptante" class="modal-overlay-aviso" style="display: none;">
        <div class="modal-tarjeta-aviso">
            <button class="btn-cerrar-modal" onclick="cerrarModalAviso()">&times;</button>
            
            <div class="circulo-icono-modal">
                <i class="fa-solid fa-paw"></i>
            </div>

            <h3 class="titulo-modal-aviso">¡Perfil de adoptante necesario!</h3>
            <p class="texto-modal-aviso">Para ver a los animalitos y enviar tu solicitud, debes crear primero tu perfil de adoptante.</p>

            <div class="contenedor-botones-modal">
                <button class="btn-modal-primario" onclick="irAFormularioAdoptante()">
                    Crear perfil de adoptante
                </button>
                <button class="btn-modal-secundario" onclick="cerrarModalAviso()">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <!-- Scripts del Proyecto -->
    <script src="script.js"></script>
    <script src="adopciones.js"></script>
    
    <script>
        const btnToggleMenu = document.getElementById('btn-toggle-menu');
        const sidebar = document.getElementById('sidebar');

        if (btnToggleMenu && sidebar) {
            btnToggleMenu.addEventListener('click', () => {
                sidebar.classList.toggle('sidebar-abierta');
            });
        }

        // Lógica para mostrar catálogo y cargar datos
        async function mostrarCatalogoAdopciones() {
            document.getElementById('pantalla-opciones-adopcion').style.display = 'none';
            document.getElementById('seccion-catalogo-animales').style.display = 'block';
            await cargarMascotasAdopcionOrdenadas();
        }

        function volverAOpciones() {
            document.getElementById('seccion-catalogo-animales').style.display = 'none';
            document.getElementById('pantalla-opciones-adopcion').style.display = 'block';
        }

        async function cargarMascotasAdopcionOrdenadas() {
            const contenedor = document.getElementById('contenedor-animales-adopcion');
            if (!contenedor) return;

            contenedor.innerHTML = '<p style="text-align:center;">Buscando animalitos cerca de ti...</p>';

            try {
                const respuesta = await fetch('/api/publicaciones-globales');
                if (!respuesta.ok) throw new Error("Error al obtener las publicaciones");
                
                const publicaciones = await respuesta.json();
                let adopciones = publicaciones.filter(pub => pub.tipo_publicacion === 'adopcion');

                // Obtenemos la ubicación que guardó el usuario en su perfil de adoptante
                const ubicacionUsuario = (localStorage.getItem('ubicacion_adoptante') || '').toLowerCase().trim();

                // ALGORITMO DE CERCANÍA POR TEXTO (Sin Leaflet ni coordenadas)
                adopciones.sort((a, b) => {
                    const ubA = (a.Ubicacion || a.ubicacion || '').toLowerCase();
                    const ubB = (b.Ubicacion || b.ubicacion || '').toLowerCase();

                    // Si la ubicación de la publicación incluye la zona del usuario, gana prioridad (1 vs 0)
                    const coincideA = ubicacionUsuario && ubA.includes(ubicacionUsuario) ? 1 : 0;
                    const coincideB = ubicacionUsuario && ubB.includes(ubicacionUsuario) ? 1 : 0;

                    return coincideB - coincideA; // Las más cercanas quedan arriba
                });

                if (adopciones.length > 0) {
                    contenedor.innerHTML = ''; 

                    for (const pub of adopciones) {
                        let imagenSrc = 'logo.png';
                        if (pub.img_reporte) {
                            try {
                                const parsed = JSON.parse(pub.img_reporte);
                                if (Array.isArray(parsed) && parsed.length > 0) imagenSrc = parsed[0];
                                else imagenSrc = pub.img_reporte;
                            } catch(e) {
                                imagenSrc = pub.img_reporte;
                            }
                        }

                        const fechaFormateada = pub.Fecha_reporte ? pub.Fecha_reporte.split('T')[0] : '';
                        let ubicacionTextoBruta = pub.Ubicacion || pub.ubicacion || '';
                        let ubicacionBonita = typeof obtenerNombreUbicacionGlobal === 'function' 
                            ? await obtenerNombreUbicacionGlobal(ubicacionTextoBruta) 
                            : ubicacionTextoBruta;

                        const tarjeta = document.createElement('article');
                        tarjeta.className = 'tarjeta-prototipo-estilo';
                        
                        tarjeta.innerHTML = `
                            <div class="proto-card-top">
                                <div class="proto-titulo-pill">Nueva publicación de adopción</div>
                                <span class="proto-fecha">${fechaFormateada}</span>
                            </div>

                            <div class="proto-card-body">
                                <div class="proto-img-wrapper">
                                    <img src="${imagenSrc}" alt="Adopción">
                                </div>

                                <div class="proto-content-right">
                                    <div class="proto-pill-tipo">${pub.nombre_tipo_reporte || 'Adopción'}</div>
                                    <div class="proto-info-extra">
                                        <span class="proto-autor">Publicado por: <a href="perfil_publico.html?user=${pub.nombre_usuario}">@${pub.nombre_usuario}</a></span>
                                        <p class="proto-ubicacion"><i class="fa-solid fa-location-dot"></i> ${ubicacionBonita}</p>
                                    </div>
                                    <div class="proto-footer-row">
                                        <button class="proto-btn-detalles btn-ver-adopcion-ficha" data-id="${pub.id_origen}">Ver detalles</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        contenedor.appendChild(tarjeta);
                    }
                } else {
                    contenedor.innerHTML = `
                        <div class="estado-vacio" style="text-align: center; padding: 40px;">
                            <h2>¡Aún no hay publicaciones de adopción!</h2>
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Error al cargar adopciones:", error);
                contenedor.innerHTML = '<p style="text-align:center;">Error al cargar las mascotas.</p>';
            }
        }
        document.addEventListener('click', (event) => {
            const botonDetalle = event.target.closest('.btn-ver-adopcion-ficha');
            if (botonDetalle) {
                const idItem = botonDetalle.getAttribute('data-id');
                if (idItem) {
                    window.location.href = `detalle_adopcion.html?id=${idItem}`;
                }
            }
        });
    </script>

    <!-- Motor oculto de Google Translate -->
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'es', autoDisplay: false }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('app_selected_lang');
            if (savedLang && savedLang !== 'es') {
                const interval = setInterval(() => {
                    const googleCombo = document.querySelector('.goog-te-combo');
                    if (googleCombo) {
                        googleCombo.value = savedLang;
                        googleCombo.dispatchEvent(new Event('change'));
                        clearInterval(interval);
                    }
                }, 200);
            }
        });
    </script>
    <style>
        .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
        .skiptranslate { display: none !important; }
    </style>
</body>
</html>
