<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Evento - ARCA</title>
    <link rel="stylesheet" href="style_home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="dark-mode.css">
    <script>
    if (localStorage.getItem("modo_oscuro") === "true") {
        document.body.classList.add("dark-mode");
    }
    </script>
    <style>
        body {
            margin: 0;
            font-family: 'Itim', cursive, sans-serif;
            background-color: #fce8e6;
            overflow-x: hidden;
        }

        .main-content {
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            box-sizing: border-box;
        }

        /* CONTENEDOR PRINCIPAL GLASSMORPHISM CON ANIMACIÓN EXÓTICA */
        .evento-container {
            width: 100%;
            max-width: 950px;
            background: rgba(255, 235, 230, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 3px solid rgba(255, 255, 255, 0.95);
            border-radius: 42px;
            padding: 45px 50px;
            box-shadow: 0 25px 60px rgba(240, 150, 130, 0.28), inset 0 0 30px rgba(255, 255, 255, 0.8);
            animation: entradaEstrambotica 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-sizing: border-box;
        }

        @keyframes entradaEstrambotica {
            0% { opacity: 0; transform: translateY(45px) scale(0.9) rotate(-1.5deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }

        .evento-titulo-seccion {
            font-size: 2.4rem;
            color: #4a3832;
            margin-top: 0;
            margin-bottom: 35px;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(220, 140, 120, 0.25);
        }

        .evento-grid-formulario {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .evento-grupo-campo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .evento-grupo-campo.ancho-completo {
            grid-column: span 3;
        }

        .evento-label {
            font-size: 1.15rem;
            color: #5c4033;
            padding-left: 6px;
        }

        /* INPUTS SUAVES Y ORGÁNICOS SIN BORDES TÍPICOS */
        .evento-input, .evento-textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 14px 18px;
            font-family: 'Itim', cursive, sans-serif;
            font-size: 1.05rem;
            color: #4a3832;
            box-shadow: inset 0 4px 10px rgba(92, 64, 51, 0.04);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .evento-input:focus, .evento-textarea:focus {
            outline: none;
            background: #ffffff;
            border-color: #fca38d;
            box-shadow: 0 8px 22px rgba(252, 163, 141, 0.35), inset 0 2px 5px rgba(92, 64, 51, 0.02);
            transform: translateY(-2px);
        }

        .evento-textarea {
            resize: vertical;
            min-height: 110px;
        }

        /* CHECKBOXES PERSONALIZADOS PASTEL */
        .evento-checkbox-grupo {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.55);
            padding: 16px 20px;
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .evento-checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            color: #5c4033;
            cursor: pointer;
        }

        .evento-checkbox-label input[type="checkbox"] {
            accent-color: #e8a87c;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* BOTÓN PUBLICAR EXÓTICO Y VIBRANTE */
        .evento-contenedor-boton {
            grid-column: span 3;
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .btn-publicar-evento {
            background: linear-gradient(135deg, #fca38d 0%, #d97736 100%);
            color: white;
            border: none;
            padding: 16px 45px;
            font-family: 'Itim', cursive, sans-serif;
            font-size: 1.25rem;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(217, 119, 54, 0.35);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-publicar-evento:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 15px 35px rgba(217, 119, 54, 0.5);
            background: linear-gradient(135deg, #f4978e 0%, #c8682a 100%);
        }

        @media (max-width: 900px) {
            .evento-grid-formulario {
                grid-template-columns: 1fr;
            }
            .evento-grupo-campo.ancho-completo, .evento-contenedor-boton {
                grid-column: span 1;
            }
            .evento-contenedor-boton {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- NAV SUPERIOR -->
    <nav class="top-nav">
        <div class="top-left">
            <i class="fa-solid fa-bars menu-icon" id="btn-toggle-menu"></i>
            <div class="mini-logo-circle"><img src="logo.png" alt="Logo ARCA"></div>
            <span class="page-title">Publicación de Evento</span>
        </div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Busca algo">
            <i class="fa-solid fa-microphone"></i>
        </div>
        <div class="top-right">
            <div class="user-header-info">
                <div class="user-profile-menu" id="user-profile-menu">
                    <div class="user-avatar-btn" id="user-avatar-btn" onclick="toggleMiniMenu()">
                        <img src="logo.png" id="user-avatar-img" alt="Perfil">
                    </div>
                </div>
                <div class="notif-circle"><a href="notificaciones.html"><i class="fa-solid fa-bell"></i></a></div>
            </div>
        </div>
    </nav>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="side-icons">
            <a href="home.html" class="menu-fila"><i class="fa-solid fa-house"></i><span class="menu-text">Inicio</span></a>
            <a href="perfil_fundacion_3.html" class="menu-fila"><i class="fa-solid fa-circle-user"></i><span class="menu-text">Perfil</span></a>
            <a href="configuracion.html" class="menu-fila"><i class="fa-solid fa-gear"></i><span class="menu-text">Ajustes</span></a>
        </div>
    </aside>

    <main class="main-content">
        <div class="evento-container">
            <h2 class="evento-titulo-seccion">Nuevo Evento de Fundación</h2>

            <form id="form-evento" class="evento-grid-formulario">
                
                <!-- COLUMNA 1: INFORMACIÓN BÁSICA -->
                <div class="evento-grupo-campo">
                    <label class="evento-label">Nombre del evento</label>
                    <input type="text" id="input-nombre-evento" class="evento-input" placeholder="Ej. Jornada de Vacunación Masiva" required>
                </div>

                <div class="evento-grupo-campo">
                    <label class="evento-label">Lugar exacto</label>
                    <input type="text" id="input-lugar" class="evento-input" placeholder="Ej. Parque Principal de Robledo" required>
                </div>

                <div class="evento-grupo-campo">
                    <label class="evento-label">Fecha y hora</label>
                    <input type="date" id="input-fecha" class="evento-input" required>
                </div>

                <!-- COLUMNA 2: UBICACIÓN Y TIPOS -->
                <div class="evento-grupo-campo">
                    <label class="evento-label">Ciudad / Zona</label>
                    <input type="text" id="input-ubicacion" class="evento-input" value="Medellín" placeholder="Ej. Medellín">
                </div>

                <div class="evento-grupo-campo">
                    <label class="evento-label">Tipo de evento</label>
                    <div class="evento-checkbox-grupo">
                        <label class="evento-checkbox-label">
                            <input type="checkbox" id="check-vacunacion" value="Vacunación"> Vacunación
                        </label>
                        <label class="evento-checkbox-label">
                            <input type="checkbox" id="check-esterilizacion" value="Esterilización"> Esterilización
                        </label>
                    </div>
                </div>

                <div class="evento-grupo-campo">
                    <label class="evento-label">Animales aplicables</label>
                    <div class="evento-checkbox-grupo">
                        <label class="evento-checkbox-label">
                            <input type="checkbox" id="check-gatos" value="Gatos"> Gatos
                        </label>
                        <label class="evento-checkbox-label">
                            <input type="checkbox" id="check-perros" value="Perros"> Perros
                        </label>
                        <label class="evento-checkbox-label">
                            <input type="checkbox" id="check-ambos" value="Ambos"> Ambos
                        </label>
                    </div>
                </div>

                <!-- COLUMNA 3: DETALLES ADICIONALES -->
                <div class="evento-grupo-campo ancho-completo">
                    <label class="evento-label">Detalles adicionales (Requisitos, cupos, recomendaciones):</label>
                    <textarea id="input-detalles" class="evento-textarea" placeholder="Escribe aquí los detalles importantes para los asistentes..."></textarea>
                </div>

                <!-- BOTÓN PUBLICAR -->
                <div class="evento-contenedor-boton">
                    <button type="submit" id="btn-publicar-evento" class="btn-publicar-evento">
                        Publicar evento
                    </button>
                </div>

            </form>
        </div>
    </main>

    <!-- SCRIPTS DE CONEXIÓN Y FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="script.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const btnToggleMenu = document.getElementById('btn-toggle-menu');
        const sidebar = document.getElementById('sidebar');
        if (btnToggleMenu && sidebar) {
            btnToggleMenu.addEventListener('click', () => {
                sidebar.classList.toggle('sidebar-abierta');
            });
        }

        const formEvento = document.getElementById('form-evento');
        if (formEvento) {
            formEvento.addEventListener('submit', async (e) => {
                e.preventDefault();

                const user = firebase.auth().currentUser;
                if (!user) {
                    alert("Debes iniciar sesión para publicar un evento.");
                    return;
                }

                const nombre_evento = document.getElementById('input-nombre-evento').value;
                const lugar = document.getElementById('input-lugar').value;
                const fecha_hora = document.getElementById('input-fecha').value;
                const ubicacion = document.getElementById('input-ubicacion').value;
                const detalles_adicionales = document.getElementById('input-detalles').value;

                if (!nombre_evento || !lugar || !fecha_hora) {
                    alert("Por favor completa los campos obligatorios.");
                    return;
                }

                const datosEvento = {
                    nombre_evento,
                    lugar,
                    ubicacion,
                    fecha_hora,
                    detalles_adicionales,
                    correo_fundacion: user.email
                };

                try {
                    const respuesta = await fetch('/api/crear-evento', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(datosEvento)
                    });

                    const resultado = await respuesta.json();
                    if (respuesta.ok) {
                        alert("¡Evento publicado con éxito!");
                        window.location.href = "novedades-eventos.html";
                    } else {
                        throw new Error(resultado.error || "No se pudo registrar el evento.");
                    }
                } catch (error) {
                    console.error("Error:", error);
                    alert("Hubo un error al publicar el evento: " + error.message);
                }
            });
        }
    });
    </script>
</body>
</html>
