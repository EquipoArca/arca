<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicación - ARCA</title>
    <link rel="stylesheet" href="style_home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="dark-mode.css">
    <script>
    if (localStorage.getItem("modo_oscuro") === "true") {
        document.body.classList.add("dark-mode");
    }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Itim', cursive, sans-serif;
            background-color: #fce8e6;
        }

        .main-content {
            height: calc(100vh - 65px);
            padding: 15px 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .evento-container {
            width: 100%;
            max-width: 820px;
            background: rgba(255, 245, 243, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            padding: 20px 32px;
            box-shadow: 0 10px 25px rgba(92, 64, 51, 0.05);
            box-sizing: border-box;
        }

        /* TÍTULO CON DETALLE AZUL PASTEL PARA EVENTOS */
        .evento-header-titulo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .evento-titulo-badge {
            background-color: #e0f2fe;
            color: #2b5b84;
            border: 1px solid #b9e6fe;
            padding: 4px 20px;
            border-radius: 20px;
            font-size: 1.45rem;
            font-weight: normal;
        }

        .evento-grid-formulario {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px 16px;
        }

        .evento-grupo-campo {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .evento-grupo-campo.ancho-completo {
            grid-column: span 3;
        }

        /* CÁPSULAS DE COLORES VARIADOS (AZUL, MELOCOTÓN, ROSA) */
        .evento-label {
            font-size: 0.9rem;
            color: #5c4033;
            background: rgba(255, 255, 255, 0.9);
            padding: 3px 12px;
            border-radius: 12px;
            display: inline-block;
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.9);
            font-weight: normal;
        }

        .evento-label.azul {
            background: #e0f2fe;
            color: #2b5b84;
            border-color: #b9e6fe;
        }

        .evento-label.melocoton {
            background: #ffe5d9;
            color: #7c4a3a;
            border-color: #fcd5c5;
        }

        .evento-label.rosa {
            background: #fce4ec;
            color: #7d4452;
            border-color: #f8bbd0;
        }

        /* INPUTS LIMPIOS Y COMPACTOS */
        .evento-input, .evento-textarea {
            width: 100%;
            background: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 8px 12px;
            font-family: 'Itim', cursive, sans-serif;
            font-size: 0.9rem;
            color: #4a3832;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .evento-input:focus, .evento-textarea:focus {
            border-color: #7dd3fc;
        }

        .evento-textarea {
            resize: none;
            height: 60px;
        }

        .evento-checkbox-grupo {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #ffffff;
            padding: 8px 12px;
            border-radius: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
        }

        .evento-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            color: #5c4033;
            cursor: pointer;
            font-weight: normal;
        }

        .evento-checkbox-label input[type="checkbox"] {
            accent-color: #7dd3fc;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        /* BOTÓN PLANO MELOCOTÓN/AZUL AL PASAR EL MOUSE */
        .evento-contenedor-boton {
            grid-column: span 3;
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .btn-publicar-evento {
            background-color: #ffe5d9;
            color: #7c4a3a;
            border: 1.5px solid #ffffff;
            padding: 8px 28px;
            font-family: 'Itim', cursive, sans-serif;
            font-size: 1.05rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: normal;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .btn-publicar-evento:hover {
            background-color: #e0f2fe;
            color: #2b5b84;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="top-left">
            <i class="fa-solid fa-bars menu-icon" id="btn-toggle-menu"></i>
            <div class="mini-logo-circle"><img src="logo.png" alt="Logo ARCA"></div>
            <span class="page-title">Publicación</span>
        </div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Busca algo">
            <i class="fa-solid fa-microphone"></i>
        </div>
        <div class="top-right">
            <div class="user-header-info">
                <div class="user-profile-menu" id="user-profile-menu">
                    <div class="user-avatar-btn" id="user-avatar-btn" onclick="toggleMiniMenu()">
                        <img src="logo.png" id="user-avatar-img" alt="Perfil">
                    </div>
                </div>
                <div class="notif-circle"><a href="notificaciones.html"><i class="fa-solid fa-bell"></i></a></div>
            </div>
        </div>
    </nav>

    <aside class="sidebar" id="sidebar">
        <div class="side-icons">
            <a href="home.html" class="menu-fila"><i class="fa-solid fa-house"></i><span class="menu-text">Inicio</span></a>
            <a href="perfil_fundacion_3.html" class="menu-fila"><i class="fa-solid fa-circle-user"></i><span class="menu-text">Perfil</span></a>
            <a href="configuracion.html" class="menu-fila"><i class="fa-solid fa-gear"></i><span class="menu-text">Ajustes</span></a>
        </div>
    </aside>

    <main class="main-content">
        <div class="evento-container">
            <div class="evento-header-titulo">
                <span id="titulo-modo-evento" class="evento-titulo-badge">Nuevo Evento</span>
            </div>

            <form id="form-evento" class="evento-grid-formulario">
                
                <div class="evento-grupo-campo">
                    <span class="evento-label azul">Nombre del evento</span>
                    <input type="text" id="input-nombre-evento" class="evento-input" placeholder="Ej. Jornada de Vacunación" required>
                </div>

                <div class="evento-grupo-campo">
                    <span class="evento-label melocoton">Lugar exacto</span>
                    <input type="text" id="input-lugar" class="evento-input" placeholder="Ej. Parque Principal de Robledo" required>
                </div>

               <div class="evento-grupo-campo">
                    <span class="evento-label rosa">Fecha y hora</span>
                    <input type="text" id="input-fecha" class="evento-input" placeholder="Ej. 10 de Junio - 8:00 am" required>
               </div>

                <div class="evento-grupo-campo">
                    <span class="evento-label melocoton">Ciudad / Zona</span>
                    <input type="text" id="input-ubicacion" class="evento-input" value="Medellín" placeholder="Ej. Medellín">
                </div>

                <div class="evento-grupo-campo">
                    <span class="evento-label azul">Tipo de evento</span>
                    <div class="evento-checkbox-grupo">
                        <label class="evento-checkbox-label">
                            <input type="checkbox" id="check-vacunacion" value="Vacunación"> Vacunación
                        </label>
                        <label class="evento-checkbox-label">
                            <input type="checkbox" id="check-esterilizacion" value="Esterilización"> Esterilización
                        </label>
                    </div>
                </div>

                <div class="evento-grupo-campo">
                    <span class="evento-label rosa">Animales aplicables</span>
                    <div class="evento-checkbox-grupo">
                        <label class="evento-checkbox-label">
                            <input type="checkbox" id="check-gatos" value="Gatos"> Gatos
                        </label>
                        <label class="evento-checkbox-label">
                            <input type="checkbox" id="check-perros" value="Perros"> Perros
                        </label>
                        <label class="evento-checkbox-label">
                            <input type="checkbox" id="check-ambos" value="Ambos"> Ambos
                        </label>
                    </div>
                </div>

                <div class="evento-grupo-campo ancho-completo">
                    <span class="evento-label melocoton">Detalles adicionales (Requisitos, cupos, recomendaciones):</span>
                    <textarea id="input-detalles" class="evento-textarea" placeholder="Escribe aquí las instrucciones para los asistentes..."></textarea>
                </div>

                <div class="evento-contenedor-boton">
                    <button type="submit" id="btn-publicar-evento" class="btn-publicar-evento">
                        Publicar evento
                    </button>
                </div>

            </form>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="script.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const btnToggleMenu = document.getElementById('btn-toggle-menu');
        const sidebar = document.getElementById('sidebar');
        if (btnToggleMenu && sidebar) {
            btnToggleMenu.addEventListener('click', () => {
                sidebar.classList.toggle('sidebar-abierta');
            });
        }

        // --- DETECTAR SI VENIMOS A EDITAR UN EVENTO ---
        const urlParams = new URLSearchParams(window.location.search);
        const idEventoEditar = urlParams.get('editar');
        const btnPublicar = document.getElementById('btn-publicar-evento');

        if (idEventoEditar) {
            document.getElementById('titulo-modo-evento').textContent = "Editar Evento";
            if (btnPublicar) btnPublicar.textContent = "Guardar cambios";

            try {
                const res = await fetch(`/api/eventos`);
                if (res.ok) {
                    const eventos = await res.json();
                    const eventoActual = eventos.find(e => e.id_evento == idEventoEditar);
                    if (eventoActual) {
                        document.getElementById('input-nombre-evento').value = eventoActual.nombre_evento || '';
                        document.getElementById('input-lugar').value = eventoActual.lugar || '';
                        document.getElementById('input-fecha').value = eventoActual.fecha_hora || '';
                        document.getElementById('input-ubicacion').value = eventoActual.ubicacion || 'Medellín';
                        document.getElementById('input-detalles').value = eventoActual.detalles_adicionales || '';
                    }
                }
            } catch (err) {
                console.error("Error al cargar datos del evento para editar:", err);
            }
        }

        // --- MANEJO DE ENVÍO (CREAR O EDITAR) ---
        const formEvento = document.getElementById('form-evento');
        if (formEvento) {
            formEvento.addEventListener('submit', async (e) => {
                e.preventDefault();

                const user = firebase.auth().currentUser;
                if (!user) {
                    alert("Debes iniciar sesión para realizar esta acción.");
                    return;
                }

                const nombre_evento = document.getElementById('input-nombre-evento').value;
                const lugar = document.getElementById('input-lugar').value;
                const fecha_hora = document.getElementById('input-fecha').value;
                const ubicacion = document.getElementById('input-ubicacion').value;
                const detalles_adicionales = document.getElementById('input-detalles').value;

                if (!nombre_evento || !lugar || !fecha_hora) {
                    alert("Por favor completa los campos obligatorios.");
                    return;
                }

                const datosEvento = {
                    nombre_evento,
                    lugar,
                    ubicacion,
                    fecha_hora,
                    detalles_adicionales,
                    correo_fundacion: user.email
                };

                const endpoint = idEventoEditar ? `/api/eventos/${idEventoEditar}` : '/api/crear-evento';
                const metodo = idEventoEditar ? 'PUT' : 'POST';

                try {
                    const respuesta = await fetch(endpoint, {
                        method: metodo,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(datosEvento)
                    });

                    const resultado = await respuesta.json();
                    if (respuesta.ok) {
                        alert(idEventoEditar ? "¡Evento actualizado con éxito!" : "¡Evento publicado con éxito!");
                        window.location.href = "mis_publicaciones.html";
                    } else {
                        throw new Error(resultado.error || "No se pudo procesar el evento.");
                    }
                } catch (error) {
                    console.error("Error:", error);
                    alert("Hubo un error: " + error.message);
                }
            });
        }
    });
    </script>
</body>
</html>
